    <script>
      (() => {
        let savedTheme = null;
        try {
          const storedTheme = localStorage.getItem("ayu-sh-kr.com:theme");
          const parsedTheme = storedTheme ? JSON.parse(storedTheme) : null;
          savedTheme =
            parsedTheme?.value === "dark" || parsedTheme?.value === "light"
              ? parsedTheme.value
              : null;
        } catch {
          savedTheme = null;
        }
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const isDark = savedTheme ? savedTheme === "dark" : prefersDark;
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.classList.toggle("light", !isDark);
        document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", isDark ? "dark" : "light");
        const browserThemeColor = getComputedStyle(document.documentElement).getPropertyValue("--browser-theme-color").trim();
        if (browserThemeColor) {
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", browserThemeColor);
        }
      })();
    </script>
    <script>
      (() => {
        const consentKey = "ayu-sh-kr.com:notice";
        const consentChoices = ["ack", "essential", "all"];
        let resolved = false;
        try {
          const raw = localStorage.getItem(consentKey);
          if (raw) {
            const record = JSON.parse(raw);
            resolved = record?.version === 1 && consentChoices.includes(record?.value?.choice);
          }
        } catch {
          // The consent component will use its guarded in-memory fallback.
        }
        document.documentElement.dataset.consentState = resolved ? "settled" : "pending";
      })();
    </script>
