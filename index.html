<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" />
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const isDark = savedTheme ? savedTheme === "dark" : prefersDark;
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.classList.toggle("light", !isDark);
        document.documentElement.classList.toggle("bg-slate-950", isDark);
        document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", isDark ? "dark" : "light");
        const backgroundColor = getComputedStyle(document.documentElement).getPropertyValue("--background-color").trim();
        if (backgroundColor) {
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", backgroundColor);
        }
      })();
    </script>
    <meta
      name="description"
      content="Ayush Kumar is a backend engineer with 4 years of experience building production systems with Kotlin, Spring Boot, AWS, PostgreSQL, and Redis."
    />
    <meta name="author" content="Ayush Kumar" />
    <link rel="canonical" href="https://ayu-sh-kr.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ayu-sh-kr" />
    <meta property="og:url" content="https://ayu-sh-kr.com/" />
    <meta property="og:title" content="Ayush Kumar — Backend Engineer" />
    <meta
      property="og:description"
      content="Production backends on the JVM and AWS. Open to backend roles and select freelance projects."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ayush Kumar — Backend Engineer (Kotlin · Spring Boot · AWS)</title>
  </head>
