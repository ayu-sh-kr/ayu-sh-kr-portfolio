text{font-family:Arial,sans-serif;fill:#efefed}.soft{fill:#b6b6bc}.mono{font-family:monospace}.hair{fill:none;stroke:#87878f;stroke-width:1.3}.plate{stroke:#8c8c94;stroke-width:1.2;stroke-linejoin:round}
.pick,.measure,.result,.idle{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:both}.pick{animation-name:pick}.measure{animation-name:measure;transform-box:fill-box;transform-origin:left}.result{animation-name:result}.idle{animation-name:idle}
@keyframes pick{0%,10%,98%,100%{opacity:0}17%,95%{opacity:1}}@keyframes measure{0%,24%,98%,100%{transform:scaleX(0);opacity:0}28%{opacity:1}48%,92%{transform:scaleX(1);opacity:1}}@keyframes result{0%,50%,98%,100%{opacity:0}60%,94%{opacity:1}}@keyframes idle{0%,62%,97%,100%{opacity:.2}68%,92%{opacity:1}}
@media(prefers-reduced-motion:reduce){.pick,.measure,.result,.idle{animation:none;opacity:1}}
.cursor{animation:click 8s infinite}.editor{animation:reveal 8s infinite}@keyframes click{0%,95%,100%{transform:translate(40px,25px);opacity:0}6%{opacity:1}13%,18%{transform:translate(0,0);opacity:1}24%,90%{opacity:0}}@keyframes reveal{0%,50%{transform:translateY(7px)}64%,100%{transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.cursor{display:none}.editor{animation:none}}.lift{animation:lift 8s ease-in-out infinite}@keyframes lift{0%,18%,92%,100%{transform:translateY(0)}38%,68%{transform:translateY(-26px)}}@media(prefers-reduced-motion:reduce){.lift{animation:none}}</style><rect x="1" y="1" width="758" height="688" rx="22" fill="#101011" stroke="#414145"/>
