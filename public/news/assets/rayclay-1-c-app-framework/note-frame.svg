<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" role="img" aria-labelledby="title desc">
<title id="title">Inside a RayClay frame</title><desc id="desc">Exploded view of a notes app. Selecting Trip list changes the selected ID in C. The layout pass measures the sidebar and editor, then the renderer paints Trip list on the display. The settled frame remains visible while the loop sleeps.</desc>
