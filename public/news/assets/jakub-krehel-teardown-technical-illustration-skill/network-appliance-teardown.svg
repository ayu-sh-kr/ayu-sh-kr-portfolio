<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 740" role="img" aria-labelledby="title desc">
<title id="title">Inside a small network appliance</title>
<desc id="desc">Concept assembly in a shared isometric projection. A vented lid, finned heatsink, processor board and hollow chassis are separated vertically. Dashed lines align the mounting holes. Dimensions and construction are illustrative, not manufacturing specifications.</desc>
