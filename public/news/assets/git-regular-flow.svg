<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title desc"><title id="title">A typical Git exchange</title><desc id="desc">In a representative Git workflow, a developer pushes to a server that updates repository objects and a branch reference. A fetching client negotiates have and want, and the server sends a pack of missing objects.</desc><!-- Inkstone dark canvas; True Matcha 900, 800, 600 fills. --><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bdce8a" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="758" height="423" rx="22" fill="#101011" stroke="#3e3e41" stroke-width="2"/><style>text{font-family:Arial,sans-serif} .title{fill:#f8faf2;font-size:25px;font-weight:700} .subtitle{fill:#afafac;font-size:17px} .cardtitle{fill:#f8faf2;font-size:18px;font-weight:700} .cardbody{fill:#d9e2bd;font-size:15px} .label{fill:#d9e2bd;font-size:16px;font-weight:700} .legend{fill:#afafac;font-size:15px}</style><text x="32" y="43" class="title">A typical Git exchange</text><text x="32" y="71" class="subtitle">One client at a time: push changes, then fetch what is missing.</text><text x="32" y="112" class="label">1  Push changes</text><path d="M42 128 Q134.5 129 227 128 Q237 128 237 138 L237 197 Q237 207 227 207 Q134.5 206 42 207 Q32 207 32 197 L32 138 Q32 128 42 128 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="46" y="160" class="cardtitle">Developer</text><text x="46" y="185" class="cardbody">git push</text><path d="M288 128 Q380.5 129 473 128 Q483 128 483 138 L483 197 Q483 207 473 207 Q380.5 206 288 207 Q278 207 278 197 L278 138 Q278 128 288 128 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="292" y="160" class="cardtitle">Git server</text><text x="292" y="185" class="cardbody">validates changes</text><path d="M534 128 Q626.5 129 719 128 Q729 128 729 138 L729 197 Q729 207 719 207 Q626.5 206 534 207 Q524 207 524 197 L524 138 Q524 128 534 128 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="538" y="160" class="cardtitle">Repository</text><text x="538" y="185" class="cardbody">objects + branch ref</text><path d="M237 167 L278 167" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M483 167 L524 167" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><text x="32" y="256" class="label">2  Fetch changes</text><path d="M42 272 Q134.5 273 227 272 Q237 272 237 282 L237 341 Q237 351 227 351 Q134.5 350 42 351 Q32 351 32 341 L32 282 Q32 272 42 272 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="46" y="304" class="cardtitle">Git client</text><text x="46" y="329" class="cardbody">have / want</text><path d="M288 272 Q380.5 273 473 272 Q483 272 483 282 L483 341 Q483 351 473 351 Q380.5 350 288 351 Q278 351 278 341 L278 282 Q278 272 288 272 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="292" y="304" class="cardtitle">Git server</text><text x="292" y="329" class="cardbody">builds missing pack</text><path d="M534 272 Q626.5 273 719 272 Q729 272 729 282 L729 341 Q729 351 719 351 Q626.5 350 534 351 Q524 351 524 341 L524 282 Q524 272 534 272 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="538" y="304" class="cardtitle">Git client</text><text x="538" y="329" class="cardbody">receives pack</text><path d="M237 311 L278 311" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M483 311 L524 311" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><text x="32" y="399" class="legend">Solid arrow = request, data or flow order</text></svg>
