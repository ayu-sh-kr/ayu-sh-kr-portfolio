<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title desc"><title id="title">A typical Git exchange</title><desc id="desc">In a representative Git workflow, a developer pushes to a server that updates repository objects and a branch reference. A fetching client negotiates have and want, and the server sends a pack of missing objects.</desc><!-- Inkstone dark canvas; True Matcha 900, 800, 600 fills. --><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bdce8a" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="758" height="423" rx="22" fill="#101011" stroke="#3e3e41" stroke-width="2"/><style>text{font-family:Arial,sans-serif} .title{fill:#f8faf2;font-size:25px;font-weight:700} .subtitle{fill:#afafac;font-size:17px} .cardtitle{fill:#f8faf2;font-size:18px;font-weight:700} .cardbody{fill:#d9e2bd;font-size:15px} .label{fill:#d9e2bd;font-size:16px;font-weight:700} .legend{fill:#afafac;font-size:15px}</style><text x="32" y="43" class="title">A typical Git exchange</text><text x="32" y="71" class="subtitle">One client at a time: push changes, then fetch what is missing.</text><text x="32" y="112" class="label">1  Push changes</text><path d="M41 128 Q35 128 34 138 L32 197 Q32 207 42 207 L227 206 Q237 207 237 197 L236 138 Q237 128 227 129 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M41 132 L227 132 L233 195" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="46" y="160" class="cardtitle">Developer</text><text x="46" y="185" class="cardbody">git push</text><path d="M287 128 Q281 128 280 138 L278 197 Q278 207 288 207 L473 206 Q483 207 483 197 L482 138 Q483 128 473 129 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M287 132 L473 132 L479 195" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="292" y="160" class="cardtitle">Git server</text><text x="292" y="185" class="cardbody">validates changes</text><path d="M533 128 Q527 128 526 138 L524 197 Q524 207 534 207 L719 206 Q729 207 729 197 L728 138 Q729 128 719 129 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M533 132 L719 132 L725 195" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="538" y="160" class="cardtitle">Repository</text><text x="538" y="185" class="cardbody">objects + branch ref</text><path d="M237 167 L278 167" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M483 167 L524 167" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><text x="32" y="256" class="label">2  Fetch changes</text><path d="M41 272 Q35 272 34 282 L32 341 Q32 351 42 351 L227 350 Q237 351 237 341 L236 282 Q237 272 227 273 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M41 276 L227 276 L233 339" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="46" y="304" class="cardtitle">Git client</text><text x="46" y="329" class="cardbody">have / want</text><path d="M287 272 Q281 272 280 282 L278 341 Q278 351 288 351 L473 350 Q483 351 483 341 L482 282 Q483 272 473 273 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M287 276 L473 276 L479 339" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="292" y="304" class="cardtitle">Git server</text><text x="292" y="329" class="cardbody">builds missing pack</text><path d="M533 272 Q527 272 526 282 L524 341 Q524 351 534 351 L719 350 Q729 351 729 341 L728 282 Q729 272 719 273 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M533 276 L719 276 L725 339" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="538" y="304" class="cardtitle">Git client</text><text x="538" y="329" class="cardbody">receives pack</text><path d="M237 311 L278 311" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M483 311 L524 311" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><text x="32" y="399" class="legend">Solid arrow = request, data or flow order</text></svg>