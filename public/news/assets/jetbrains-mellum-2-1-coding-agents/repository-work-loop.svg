<title id="title">Mellum2.1: inspect, edit and test a repository</title>
<desc id="desc">Three workstations share an isometric base. Repository files move from inspection to a code edit, then to a test runner. Test feedback returns to the edit station. Moving markers show the sequence; the complete loop remains visible with reduced motion. This illustrates an agent workflow, not a benchmark result.</desc>
