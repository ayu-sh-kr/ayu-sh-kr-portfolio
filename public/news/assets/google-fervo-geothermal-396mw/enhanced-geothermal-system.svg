<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Enhanced geothermal power, from hot rock to the grid</title>
  <desc id="desc">A compact isometric cutaway. Water descends through an injection well, travels through fractured hot rock, rises through a production well, and transfers heat at a surface power plant. Electricity flows from the plant to the grid. Animated marks show the water and power directions.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#363636"/><stop offset="1" stop-color="#202020"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#343434"/><stop offset="1" stop-color="#171717"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d1d1d"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
    <radialGradient id="warm"><stop stop-color="#fff" stop-opacity=".22"/><stop offset=".58" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(37)"><path d="M0 0v12" stroke="#8b8b8b" stroke-opacity=".24" stroke-width="2"/></pattern>
    <marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#f7f7f7"/></marker>
    <style>
      .caption{font:700 24px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.025em;fill:#f5f5f5}
      .sub{font:600 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cfcfcf}
      .edge{stroke:#e5e5e5;stroke-width:2.5;stroke-linejoin:round}
      .strata{fill:none;stroke:#999;stroke-opacity:.52;stroke-width:2}
      .water{fill:none;stroke:#fafafa;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
      .moving-water{fill:none;stroke:#242424;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 22;animation:flow 1.4s linear infinite}
      .power{fill:none;stroke:#f8f8f8;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 8;animation:flow 1.7s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-50}}
      @media(prefers-reduced-motion:reduce){.moving-water,.power{animation:none}}
    </style>
  </defs>
  <rect width="960" height="540" rx="24" fill="#090909"/>

  <!-- The top plane and two visible faces make a single dimensional block. -->
  <path class="edge" d="M68 169 474 49 892 169 484 295Z" fill="url(#top)"/>
  <path class="edge" d="M68 169 484 295V463L68 336Z" fill="url(#left)"/>
  <path class="edge" d="M484 295 892 169V336L484 463Z" fill="url(#right)"/>
  <path d="M68 283 484 408V463L68 336ZM484 408 892 283V336L484 463Z" fill="url(#hatch)"/>
  <path class="strata" d="M68 216 484 342 892 216M68 259 484 385 892 259M68 302 484 428 892 302"/>
  <path d="M108 166 473 58 850 167M105 180 483 291 858 177" fill="none" stroke="#c4c4c4" stroke-opacity=".24" stroke-width="1.5"/>

  <!-- Heat and fractures sit behind the circulation pipe. -->
  <ellipse cx="482" cy="388" rx="168" ry="93" fill="url(#warm)"/>
  <g fill="none" stroke="#d3d3d3" stroke-width="2.8" stroke-linecap="round" opacity=".8">
    <path d="m359 346 26-23 15 25 24-29 18 34 26-20 16 27 21-24 20 32 22-25 20 29"/>
    <path d="m382 389 17-21 18 10 18-23 20 20 23-24 15 28 26-17 24 19 27-25"/>
    <path d="m415 330-6-20m48 58-15 18m74-29 17-16m31 42 20 15m-155 1-18 16"/>
    <path d="M454 329c-15-13 14-22 0-34m28 35c-13-13 14-22 0-35m28 39c-14-13 14-21 0-33" opacity=".7"/>
  </g>

  <!-- A dark rim and bright inner tube keep the two well paths readable at small sizes. -->
  <path d="M250 187V313Q250 330 270 337L446 390Q482 401 511 392L596 366Q616 360 616 340V205" fill="none" stroke="#070707" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 187V313Q250 330 270 337L446 390Q482 401 511 392L596 366Q616 360 616 340V205" class="water"/>
  <path d="M250 187V313Q250 330 270 337L446 390Q482 401 511 392L596 366Q616 360 616 340V205" class="moving-water"/>
  <path d="M250 266v32M366 365l31 9M548 381l31-10M616 322v-33" fill="none" stroke="#f8f8f8" stroke-width="2.8" marker-end="url(#tip)"/>

  <!-- Small pump heads are anchored to the top plane. -->
  <g stroke="#f5f5f5" stroke-width="2.3" stroke-linejoin="round">
    <path d="m226 168 24-8 25 8-25 9z" fill="#bcbcbc"/>
    <path d="m226 168 24 9v18l-24-9z" fill="#303030"/>
    <path d="m250 177 25-9v18l-25 9z" fill="#151515"/>
    <path d="m592 180 24-8 25 8-25 9z" fill="#bcbcbc"/>
    <path d="m592 180 24 9v18l-24-9z" fill="#303030"/>
    <path d="m616 189 25-9v18l-25 9z" fill="#151515"/>
  </g>

  <!-- Production well brings heat to an isometric power plant. -->
  <path d="M641 181 676 169" fill="none" stroke="#fafafa" stroke-width="5" stroke-linecap="round" marker-end="url(#tip)"/>
  <g class="edge">
    <path d="m676 143 59-18 61 19-60 19z" fill="#d3d3d3"/>
    <path d="m676 143 60 20v52l-60-19z" fill="#3d3d3d"/>
    <path d="m736 163 60-19v52l-60 19z" fill="#1d1d1d"/>
    <path d="m690 137 15-5v-25l-15 5zm34-10 15-5V98l-15 5z" fill="#dedede"/>
  </g>
  <path d="m698 176 24 7m-24 8 24 7m29-26 29-9m-29 24 29-9" fill="none" stroke="#eaeaea" stroke-width="2" stroke-linecap="round"/>

  <!-- Electricity leaves for a grid tower, not a direct data-center wire. -->
  <path class="power" d="M795 151 824 137 855 132" marker-end="url(#tip)"/>
  <g fill="none" stroke="#eee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="m849 124 17 70m10-70-17 70m-15-50h37m-33 14h29m-24-40h17m-27 77h43m-21-90v14m-23 13h45"/>
    <path d="m832 141-28 14m75-14 26 13" stroke-width="2"/>
  </g>

  <!-- A surface return completes the water loop with the injection well. -->
  <path d="M678 194C567 142 396 125 275 168" fill="none" stroke="#bcbcbc" stroke-width="3" stroke-dasharray="6 7" marker-end="url(#tip)"/>

  <text x="92" y="247" class="caption">1 · INJECT</text>
  <text x="403" y="501" class="caption">2 · HEAT</text>
  <text x="648" y="323" class="caption">3 · RETURN</text>
  <text x="695" y="265" class="sub">PLANT</text>
  <text x="827" y="264" class="caption">GRID</text>
</svg>
