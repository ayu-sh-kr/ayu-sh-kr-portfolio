<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How an enhanced geothermal system works</title>
  <desc id="desc">Isometric cutaway showing water injected through a well into hot fractured rock, then returned through a second well to a surface power plant. Animated dashed marks show the water moving through the loop.</desc>
  <defs>
    <pattern id="rock-hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0v18" stroke="#555" stroke-width="2" opacity=".55"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9z" fill="#f4f4f4"/>
    </marker>
    <style>
      .label{font:600 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f4f4;letter-spacing:.02em}
      .small{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#c9c9c9}
      .layer{stroke:#888;stroke-width:2}
      .flow{fill:none;stroke:#f4f4f4;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .flow-dash{fill:none;stroke:#0a0a0a;stroke-width:3;stroke-dasharray:3 17;stroke-linecap:round;animation:move 1.8s linear infinite}
      .fracture{fill:none;stroke:#e5e5e5;stroke-width:3;stroke-linecap:round;opacity:.82}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
      @keyframes move{to{stroke-dashoffset:-40}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.flow-dash,.spin{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#0a0a0a"/>
  <text x="54" y="54" class="small" letter-spacing=".16em">ENHANCED GEOTHERMAL · THE WATER LOOP</text>

  <!-- Isometric ground surface and cutaway block -->
  <path d="M82 230 594 72 1118 230 604 402Z" fill="#252525" stroke="#bdbdbd" stroke-width="3"/>
  <path d="M82 230 604 402V630L82 458Z" fill="#1b1b1b" stroke="#8c8c8c" stroke-width="3"/>
  <path d="M604 402 1118 230V458L604 630Z" fill="#111" stroke="#8c8c8c" stroke-width="3"/>

  <!-- Geologic strata on the front and side faces -->
  <path d="M82 286 604 458 1118 286M82 344 604 516 1118 344M82 401 604 573 1118 401" fill="none" stroke="#777" stroke-width="2" opacity=".8"/>
  <path d="M82 401 604 573V630L82 458Z" fill="url(#rock-hatch)" opacity=".45"/>
  <path d="M604 573 1118 401V458L604 630Z" fill="url(#rock-hatch)" opacity=".38"/>
  <path d="M82 401 604 573 1118 401V458L604 630 82 458Z" fill="#d8d8d8" opacity=".06"/>

  <!-- Surface plant -->
  <g stroke="#f2f2f2" stroke-width="3" stroke-linejoin="round">
    <path d="m130 193 87-27 83 28-88 28z" fill="#111"/>
    <path d="m130 193 82 28v49l-82-28z" fill="#222"/>
    <path d="m212 221 88-27v49l-88 27z" fill="#171717"/>
    <path d="m151 199 47-15 45 16-47 15z" fill="#aaa"/>
    <path d="m257 183 24-7v-39m-9 41v-34" fill="none"/>
    <path d="M263 130c-10-11 7-16 0-28m17 29c-10-11 7-16 0-28" fill="none" stroke="#aaa" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="125" y="320" class="label">POWER PLANT</text>
  <text x="125" y="344" class="small">Heat becomes electricity</text>

  <!-- Data center and power connection -->
  <g stroke="#f2f2f2" stroke-width="3" stroke-linejoin="round">
    <path d="m835 176 112-35 116 35-113 37z" fill="#303030"/>
    <path d="m835 176 115 37v79l-115-39z" fill="#191919"/>
    <path d="m950 213 113-37v78l-113 38z" fill="#111"/>
    <path d="m859 188 26-8v51l-26-9zm43 14 26-8v51l-26-9zm63 2 25-8v51l-25 8zm43-15 25-8v51l-25 8z" fill="#aaa" stroke="#aaa"/>
  </g>
  <path d="M304 174C405 143 500 102 594 88S744 120 825 154" fill="none" stroke="#e7e7e7" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M300 232C344 246 380 254 421 238" fill="none" stroke="#f4f4f4" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="866" y="320" class="label">DATA CENTER</text>
  <text x="866" y="344" class="small">Power joins the grid</text>

  <!-- Wellheads at the surface -->
  <g stroke="#f4f4f4" stroke-width="4" fill="#111">
    <path d="M404 287V226h34v61M397 226h48M410 214h22v12"/>
    <path d="M702 386V300h34v86M695 300h48M708 288h22v12"/>
  </g>
  <text x="352" y="179" class="small">INJECTION WELL</text>
  <text x="672" y="264" class="small">PRODUCTION WELL</text>

  <!-- Deep wells and horizontal reservoir loop -->
  <path class="flow" d="M421 287V480Q421 497 438 503L585 551Q604 558 625 551L695 528Q719 520 719 494V386"/>
  <path class="flow-dash" d="M421 287V480Q421 497 438 503L585 551Q604 558 625 551L695 528Q719 520 719 494V386"/>
  <path d="M421 329v44M421 398v42M468 513l40 13M551 540l40 13M640 546l37-12M719 475v-45M719 414v-18" fill="none" stroke="#f4f4f4" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Engineered fracture network -->
  <g class="fracture">
    <path d="m500 496 18-32 10 18 22-42 8 32 23-20 13 36 27-24 8 40"/>
    <path d="m531 522 12-25 19 9 11-27 19 15 15-23 17 28 21-10 12 21"/>
    <path d="m565 480-8-21m53 49 17 23m-91-10-18 12m133-36 25-14"/>
  </g>
  <text x="464" y="604" class="small">HOT, FRACTURED ROCK</text>

  <!-- Surface flow return to plant -->
  <path d="M702 300 666 278 594 265 514 252 438 228 300 207" fill="none" stroke="#f4f4f4" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="m650 274-24-5m-48-1-24-4m-49-14-22-7m-40-27-24-7" fill="none" stroke="#f4f4f4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Numbered steps -->
  <g font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="386" cy="458" r="15" fill="#f4f4f4"/><text x="386" y="463" fill="#0a0a0a">1</text>
    <circle cx="601" cy="524" r="15" fill="#f4f4f4"/><text x="601" y="529" fill="#0a0a0a">2</text>
    <circle cx="749" cy="459" r="15" fill="#f4f4f4"/><text x="749" y="464" fill="#0a0a0a">3</text>
  </g>
  <text x="54" y="680" class="small">1 · Water goes down  →  2 · Hot rock heats it  →  3 · Heated water returns to generate power</text>
</svg>
