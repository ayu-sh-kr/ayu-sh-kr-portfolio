<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Geothermal circulation and electricity generation</title><desc id="desc">An isometric cutaway shows water descending into a fractured hot rock reservoir, returning through a second well, and passing through a surface power plant. A turbine generates electricity for transmission lines. Moving arrows show circulation and electricity. This is a conceptual illustration, not a construction drawing.</desc><defs><linearGradient id="rock" x2="0" y2="1"><stop stop-color="#353535"/><stop offset="1" stop-color="#111"/></linearGradient><radialGradient id="heat"><stop stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#fff"/></marker><style>.edge{stroke:#aaa;stroke-width:1.8;stroke-linejoin:round}.flow{fill:none;stroke:#111;stroke-width:3;stroke-dasharray:2 22;stroke-linecap:round;animation:flow 2s linear infinite}.power{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:5 12;animation:flow 2s linear infinite}.heat{fill:none;stroke:#ddd;stroke-width:2;opacity:.6;animation:heat 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-48}}@keyframes heat{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){.flow,.power,.heat{animation:none}}</style></defs><rect width="960" height="640" rx="24" fill="#090909"/>
