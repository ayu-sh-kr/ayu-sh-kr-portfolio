<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
<title id="title">Why Pando reuses Git packfiles</title><desc id="desc">Many agents push changes and trigger CI fetches. Pando stores packs and metadata, then gives clients links to reusable packs served from a regional cache. Background compaction groups packs.</desc>
<rect width="760" height="610" rx="28" fill="#111722"/>
<g font-family="system-ui, sans-serif" fill="#edf1f5"><text x="36" y="52" font-size="24" font-weight="700">One push, many readers</text><text x="36" y="82" font-size="16" fill="#b6c3d0">Agents and CI multiply the work behind familiar Git commands.</text></g>
<g fill="#1d2b39" stroke="#829eaa" stroke-width="2"><rect x="38" y="112" width="204" height="75" rx="15"/><rect x="279" y="112" width="202" height="75" rx="15"/><rect x="518" y="112" width="204" height="75" rx="15"/><rect x="155" y="263" width="204" height="82" rx="15"/><rect x="401" y="263" width="204" height="82" rx="15"/><rect x="155" y="432" width="204" height="82" rx="15"/><rect x="401" y="432" width="204" height="82" rx="15"/></g>
<g font-family="system-ui, sans-serif" fill="#edf1f5" text-anchor="middle"><text x="140" y="145" font-size="18" font-weight="700">Agents push</text><text x="140" y="169" font-size="14">many branches</text><text x="380" y="145" font-size="18" font-weight="700">Pando</text><text x="380" y="169" font-size="14">validates and records</text><text x="620" y="145" font-size="18" font-weight="700">CI and agents</text><text x="620" y="169" font-size="14">fetch the changes</text><text x="257" y="297" font-size="18" font-weight="700">Blob storage</text><text x="257" y="321" font-size="14">reusable packfiles</text><text x="503" y="297" font-size="18" font-weight="700">Metadata</text><text x="503" y="321" font-size="14">branch versions + links</text><text x="257" y="466" font-size="18" font-weight="700">Compaction</text><text x="257" y="490" font-size="14">groups smaller packs</text><text x="503" y="466" font-size="18" font-weight="700">Regional cache</text><text x="503" y="490" font-size="14">serves pack downloads</text></g>
<g fill="none" stroke="#80c5bf" stroke-width="3" stroke-linecap="round"><path d="M242 150h34"/><path d="M380 188v37H257v34"/><path d="M380 225h123v34"/><path d="M257 346v82"/><path d="M359 473h38"/><path d="M605 473h55V191"/></g>
<g fill="#80c5bf"><path d="m276 144 9 6-9 6z"/><path d="m251 257 6 9 6-9z"/><path d="m497 257 6 9 6-9z"/><path d="m251 426 6 9 6-9z"/><path d="m396 467 9 6-9 6z"/><path d="m654 195 6-9 6 9z"/></g>
<text x="380" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#b6c3d0">On fetch, Pando selects packs and returns download links.</text></svg>