<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc"><title id="title">Pando: write once, reuse the pack</title><desc id="desc">Pando validates a pushed pack, stores it in blob storage, and records the branch version in metadata. On fetch, it chooses pack URLs; the client downloads reusable packs from Express. Background compaction groups packs.</desc><!-- Inkstone dark canvas; True Matcha 900, 800, 600 fills. --><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bdce8a" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="758" height="798" rx="22" fill="#101011" stroke="#3e3e41" stroke-width="2"/><style>text{font-family:Arial,sans-serif} .title{fill:#f8faf2;font-size:25px;font-weight:700} .subtitle{fill:#afafac;font-size:17px} .cardtitle{fill:#f8faf2;font-size:18px;font-weight:700} .cardbody{fill:#d9e2bd;font-size:15px} .label{fill:#d9e2bd;font-size:16px;font-weight:700} .legend{fill:#afafac;font-size:15px}</style><text x="32" y="43" class="title">Pando: write once, reuse the pack</text><text x="32" y="71" class="subtitle">A Git-compatible path for many concurrent agents and jobs.</text><text x="32" y="112" class="label">1  Push: make a branch version available</text><path d="M41 128 Q35 128 34 138 L32 197 Q32 207 42 207 L227 206 Q237 207 237 197 L236 138 Q237 128 227 129 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M41 132 L227 132 L233 195" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="46" y="160" class="cardtitle">Agent</text><text x="46" y="185" class="cardbody">sends a pack</text><path d="M287 128 Q281 128 280 138 L278 197 Q278 207 288 207 L473 206 Q483 207 483 197 L482 138 Q483 128 473 129 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M287 132 L473 132 L479 195" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="292" y="160" class="cardtitle">Pando</text><text x="292" y="185" class="cardbody">validates pack</text><path d="M533 128 Q527 128 526 138 L524 197 Q524 207 534 207 L719 206 Q729 207 729 197 L728 138 Q729 128 719 129 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M533 132 L719 132 L725 195" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="538" y="160" class="cardtitle">Blob storage</text><text x="538" y="185" class="cardbody">stores pack</text><path d="M237 167 L278 167" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M483 167 L524 167" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M626 207 L626 244" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><text x="416" y="232" class="label">then Pando records</text><path d="M533 244 Q527 244 526 254 L524 313 Q524 323 534 323 L719 322 Q729 323 729 313 L728 254 Q729 244 719 245 Z" fill="#5d702d" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M533 248 L719 248 L725 311" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="538" y="276" class="cardtitle">Metadata store</text><text x="538" y="301" class="cardbody">records ref + pack</text><text x="32" y="366" class="label">2  Fetch: select packs, reuse the bytes</text><path d="M41 382 Q35 382 34 392 L32 451 Q32 461 42 461 L227 460 Q237 461 237 451 L236 392 Q237 382 227 383 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M41 386 L227 386 L233 449" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="46" y="414" class="cardtitle">CI / agent</text><text x="46" y="439" class="cardbody">requests branch</text><path d="M287 382 Q281 382 280 392 L278 451 Q278 461 288 461 L473 460 Q483 461 483 451 L482 392 Q483 382 473 383 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M287 386 L473 386 L479 449" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="292" y="414" class="cardtitle">Pando</text><text x="292" y="439" class="cardbody">selects pack URLs</text><path d="M533 382 Q527 382 526 392 L524 451 Q524 461 534 461 L719 460 Q729 461 729 451 L728 392 Q729 382 719 383 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M533 386 L719 386 L725 449" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="538" y="414" class="cardtitle">Git client</text><text x="538" y="439" class="cardbody">receives URLs</text><path d="M237 421 L278 421" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M483 421 L524 421" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M626 461 L626 500" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M533 500 Q527 500 526 510 L524 569 Q524 579 534 579 L719 578 Q729 579 729 569 L728 510 Q729 500 719 501 Z" fill="#5d702d" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M533 504 L719 504 L725 567" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="538" y="532" class="cardtitle">Express cache</text><text x="538" y="557" class="cardbody">serves packs</text><path d="M41 500 Q35 500 34 510 L32 569 Q32 579 42 579 L227 578 Q237 579 237 569 L236 510 Q237 500 227 501 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M41 504 L227 504 L233 567" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="46" y="532" class="cardtitle">Git client</text><text x="46" y="557" class="cardbody">downloads packs</text><path d="M524 539 L237 539" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><text x="32" y="627" class="label">3  Background work</text><path d="M41 645 Q35 645 34 655 L32 714 Q32 724 42 724 L292 723 Q302 724 302 714 L301 655 Q302 645 292 646 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M41 649 L292 649 L298 712" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="46" y="677" class="cardtitle">Compaction</text><text x="46" y="702" class="cardbody">groups stored packs</text><path d="M302 684 L382 684" fill="none" stroke="#bdce8a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arr)"/><path d="M391 645 Q385 645 384 655 L382 714 Q382 724 392 724 L719 723 Q729 724 729 714 L728 655 Q729 645 719 646 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><path d="M391 649 L719 649 L725 712" fill="none" opacity=".23" stroke="#bdce8a" stroke-width="1.2"/><text x="396" y="677" class="cardtitle">Larger reusable packs</text><text x="396" y="702" class="cardbody">fewer downloads for catch-up</text><path d="M32 764 L75 764" stroke="#bdce8a" stroke-width="2.5" marker-end="url(#arr)"/><text x="86" y="769" class="legend">request / data / order</text><path d="M260 764 L303 764" stroke="#bdce8a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="314" y="769" class="legend">background work</text></svg>