<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc"><title id="title">Pando: write once, reuse the pack</title><desc id="desc">Pando validates a pushed pack, stores it in blob storage, and records the branch version in metadata. On fetch, it chooses pack URLs; the client downloads reusable packs from Express. Background compaction groups packs.</desc><!-- Inkstone dark canvas; True Matcha 900, 800, 600 fills. --><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bdce8a" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="1" y="1" width="758" height="798" rx="22" fill="#101011" stroke="#3e3e41" stroke-width="2"/><style>text{font-family:Arial,sans-serif} .title{fill:#f8faf2;font-size:25px;font-weight:700} .subtitle{fill:#afafac;font-size:17px} .cardtitle{fill:#f8faf2;font-size:18px;font-weight:700} .cardbody{fill:#d9e2bd;font-size:15px} .label{fill:#d9e2bd;font-size:16px;font-weight:700} .legend{fill:#afafac;font-size:15px}</style><text x="32" y="43" class="title">Pando: write once, reuse the pack</text><text x="32" y="71" class="subtitle">A Git-compatible path for many concurrent agents and jobs.</text><text x="32" y="112" class="label">1  Push: make a branch version available</text><path d="M42 128 Q134.5 129 227 128 Q237 128 237 138 L237 197 Q237 207 227 207 Q134.5 206 42 207 Q32 207 32 197 L32 138 Q32 128 42 128 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="46" y="160" class="cardtitle">Agent</text><text x="46" y="185" class="cardbody">sends a pack</text><path d="M288 128 Q380.5 129 473 128 Q483 128 483 138 L483 197 Q483 207 473 207 Q380.5 206 288 207 Q278 207 278 197 L278 138 Q278 128 288 128 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="292" y="160" class="cardtitle">Pando</text><text x="292" y="185" class="cardbody">validates pack</text><path d="M534 128 Q626.5 129 719 128 Q729 128 729 138 L729 197 Q729 207 719 207 Q626.5 206 534 207 Q524 207 524 197 L524 138 Q524 128 534 128 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="538" y="160" class="cardtitle">Blob storage</text><text x="538" y="185" class="cardbody">stores pack</text><path d="M237 167 L278 167" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M483 167 L524 167" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M626 207 L626 244" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><text x="416" y="232" class="label">then Pando records</text><path d="M534 244 Q626.5 245 719 244 Q729 244 729 254 L729 313 Q729 323 719 323 Q626.5 322 534 323 Q524 323 524 313 L524 254 Q524 244 534 244 Z" fill="#5d702d" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="538" y="276" class="cardtitle">Metadata store</text><text x="538" y="301" class="cardbody">records ref + pack</text><text x="32" y="366" class="label">2  Fetch: select packs, reuse the bytes</text><path d="M42 382 Q134.5 383 227 382 Q237 382 237 392 L237 451 Q237 461 227 461 Q134.5 460 42 461 Q32 461 32 451 L32 392 Q32 382 42 382 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="46" y="414" class="cardtitle">CI / agent</text><text x="46" y="439" class="cardbody">requests branch</text><path d="M288 382 Q380.5 383 473 382 Q483 382 483 392 L483 451 Q483 461 473 461 Q380.5 460 288 461 Q278 461 278 451 L278 392 Q278 382 288 382 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="292" y="414" class="cardtitle">Pando</text><text x="292" y="439" class="cardbody">selects pack URLs</text><path d="M534 382 Q626.5 383 719 382 Q729 382 729 392 L729 451 Q729 461 719 461 Q626.5 460 534 461 Q524 461 524 451 L524 392 Q524 382 534 382 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="538" y="414" class="cardtitle">Git client</text><text x="538" y="439" class="cardbody">receives URLs</text><path d="M237 421 L278 421" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M483 421 L524 421" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M626 461 L626 500" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><path d="M534 500 Q626.5 501 719 500 Q729 500 729 510 L729 569 Q729 579 719 579 Q626.5 578 534 579 Q524 579 524 569 L524 510 Q524 500 534 500 Z" fill="#5d702d" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="538" y="532" class="cardtitle">Express cache</text><text x="538" y="557" class="cardbody">serves packs</text><path d="M42 500 Q134.5 501 227 500 Q237 500 237 510 L237 569 Q237 579 227 579 Q134.5 578 42 579 Q32 579 32 569 L32 510 Q32 500 42 500 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="46" y="532" class="cardtitle">Git client</text><text x="46" y="557" class="cardbody">downloads packs</text><path d="M524 539 L237 539" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/><text x="32" y="627" class="label">3  Background work</text><path d="M42 645 Q167.0 646 292 645 Q302 645 302 655 L302 714 Q302 724 292 724 Q167.0 723 42 724 Q32 724 32 714 L32 655 Q32 645 42 645 Z" fill="#38441b" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="46" y="677" class="cardtitle">Compaction</text><text x="46" y="702" class="cardbody">groups stored packs</text><path d="M302 684 L382 684" fill="none" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arr)"/><path d="M392 645 Q555.5 646 719 645 Q729 645 729 655 L729 714 Q729 724 719 724 Q555.5 723 392 724 Q382 724 382 714 L382 655 Q382 645 392 645 Z" fill="#242c12" stroke="#bdce8a" stroke-width="2" stroke-linejoin="round"/><text x="396" y="677" class="cardtitle">Larger reusable packs</text><text x="396" y="702" class="cardbody">fewer downloads for catch-up</text><path d="M32 764 L75 764" stroke="#bdce8a" stroke-width="2" marker-end="url(#arr)"/><text x="86" y="769" class="legend">request / data / order</text><path d="M260 764 L303 764" stroke="#bdce8a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arr)"/><text x="314" y="769" class="legend">background work</text></svg>
