<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
<title id="title">How Pando shares Git data</title><desc id="desc">A push goes through Pando, which stores packfiles and branch metadata. Fetching clients ask Pando for packfile links, then download reusable packs through Express and its regional cache. Compaction groups packs in the background.</desc>
<rect x="1" y="1" width="758" height="588" rx="24" fill="#101011" stroke="#3e3e41" stroke-width="2"/>
<g font-family="Trebuchet MS, sans-serif" fill="#fafaf8"><text x="32" y="49" font-size="25" font-weight="bold">One push, many readers</text><text x="32" y="77" font-size="16" fill="#afafac">Pando reuses Git data when agents and CI fetch.</text></g>
<g fill="#1d1d1f" stroke="#92a951" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<path d="M48 132 Q48 117 64 118 L214 119 Q230 119 230 134 L229 187 Q229 201 213 201 L63 200 Q47 200 48 185 Z"/>
<path d="M297 132 Q297 117 313 118 L463 119 Q479 119 479 134 L478 187 Q478 201 462 201 L312 200 Q296 200 297 185 Z"/>
<path d="M546 132 Q546 117 562 118 L712 119 Q728 119 728 134 L727 187 Q727 201 711 201 L561 200 Q545 200 546 185 Z"/>
