</g>
<g font-family="Trebuchet MS, sans-serif" text-anchor="middle" fill="#fafaf8"><text x="139" y="153" font-size="20" font-weight="bold">Agent</text><text x="139" y="181" font-size="16" fill="#d0d0cd">pushes changes</text><text x="388" y="153" font-size="20" font-weight="bold">Pando</text><text x="388" y="181" font-size="16" fill="#d0d0cd">validates push</text><text x="637" y="153" font-size="20" font-weight="bold">Storage</text><text x="637" y="181" font-size="16" fill="#d0d0cd">packs + metadata</text><text x="139" y="409" font-size="20" font-weight="bold">CI / agents</text><text x="139" y="437" font-size="16" fill="#d0d0cd">request a fetch</text><text x="388" y="409" font-size="20" font-weight="bold">Pando</text><text x="388" y="437" font-size="16" fill="#d0d0cd">selects pack links</text><text x="637" y="409" font-size="20" font-weight="bold">Express cache</text><text x="637" y="437" font-size="16" fill="#d0d0cd">serves stored packs</text></g>
