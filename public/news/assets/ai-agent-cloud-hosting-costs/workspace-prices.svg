<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486" role="img" aria-labelledby="title description">
  <title id="title">What one workspace costs per month</title>
  <desc id="description">USD for one retained workspace over 730 hours, before models. Values for 40 and 730 awake hours respectively: Maritime 2 and 2; Agent37 0.60 and 4.76; Cube 4.44 and 12; DigitalOcean 24 and 24; Manus 30 and 30.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #f7f7f6; font-size: 17px; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle, .tick { fill: #d0d0cd; font-size: 15px; }
    .label, .value { font-weight: 650; }
    .value { font-variant-numeric: tabular-nums; }
  </style>
  <rect x="1" y="1" width="718" height="484" rx="20" fill="#101011" stroke="#3e3e41" stroke-width="2"/>
  <text x="28" y="44" class="title">What one workspace costs per month</text>
  <text x="28" y="72" class="subtitle" >About 4 GB RAM. Disk, CPU priority and wake behavior vary by provider.</text>
