<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img" aria-labelledby="title description">
  <title id="title">When the bill counts active CPU</title>
  <desc id="description">Over 40 provisioned hours with 4 GB of RAM, at 20 active core-hours Upstash meters 2 dollars and Vercel meters 5.95 dollars. At 80 active core-hours Upstash meters 8 dollars and Vercel meters 13.63 dollars. Vercel totals each include 3.39 dollars of provisioned memory.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #f7f7f6; font-size: 17px; }
    .title { font-size: 27px; font-weight: 700; }
    .subtitle, .tick { fill: #d0d0cd; font-size: 15px; }
    .label, .value { font-weight: 650; }
    .value { font-variant-numeric: tabular-nums; }
  </style>
  <rect x="1" y="1" width="718" height="414" rx="20" fill="#101011" stroke="#3e3e41" stroke-width="2"/>
  <text x="28" y="44" class="title">When the bill counts active CPU</text>
  <text x="28" y="72" class="subtitle" >40 sandbox hours with 4 GB RAM. Each pair uses the same CPU time.</text>
