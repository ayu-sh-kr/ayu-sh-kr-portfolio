<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">An agent’s work uses more than CPU</title>
<desc id="desc">Illustrative host resources in a shared isometric coordinate system. The numbered sequence follows incoming dependencies through a network socket, CPU execution with RAM activity, disk writes, and outgoing results. An eight-second cycle leaves the saved result visible before resetting. Reduced motion shows the same labeled components and a completed disk write without moving packets. These resources are not dedicated hardware per sandbox.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8" fill="context-stroke"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#242c12}.label{font-size:20px;font-weight:650}.note{font-size:16px}.edge{stroke:#5d702d;stroke-width:1.4;stroke-linejoin:round}.route{fill:none;stroke-width:2;stroke-linejoin:round}.leader{stroke:#92a951;stroke-width:1.2;fill:none}
.moving{fill:#5d702d;stroke:#f8faf2;stroke-width:1;opacity:0;animation-duration:8s;animation-timing-function:linear;animation-iteration-count:infinite}
.incoming{animation-name:incoming}.received{animation-name:received}.memory-transfer{animation-name:memory-transfer}.storage-transfer{animation-name:storage-transfer}.outgoing{animation-name:outgoing;fill:#242c12}
.cpu{animation:execute 8s linear infinite}.nic{animation:network 8s linear infinite}.ram{animation:memory 8s linear infinite}.ram-1,.ram-4{animation-delay:.15s}.ram-2,.ram-5{animation-delay:.3s}
.disk-write{fill:none;stroke:#5d702d;stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:write 8s linear infinite}.write-1{animation-delay:.18s}.write-2{animation-delay:.36s}
@keyframes incoming{0%{offset-distance:0%;opacity:0}2%{opacity:1}16%{offset-distance:100%;opacity:1}17%,100%{offset-distance:100%;opacity:0}}
@keyframes received{0%,18%{offset-distance:0%;opacity:0}19%{opacity:1}24%{offset-distance:100%;opacity:1}25%,100%{offset-distance:100%;opacity:0}}
@keyframes memory-transfer{0%,27%{offset-distance:0%;opacity:0}28%{opacity:1}35%{offset-distance:100%;opacity:1}36%,100%{offset-distance:100%;opacity:0}}
@keyframes storage-transfer{0%,53%{offset-distance:0%;opacity:0}54%{opacity:1}60%{offset-distance:100%;opacity:1}61%,100%{offset-distance:100%;opacity:0}}
@keyframes outgoing{0%,77%{offset-distance:0%;opacity:0}78%{opacity:1}91%{offset-distance:100%;opacity:1}92%,100%{offset-distance:100%;opacity:0}}
@keyframes execute{0%,23%,54%,100%{fill:#d9e2bd}28%,39%,49%{fill:#6a7f33}34%,44%{fill:#bdce8a}}
@keyframes memory{0%,29%,56%,100%{fill:#5d702d}35%,48%{fill:#bdce8a}41%{fill:#6a7f33}}
@keyframes network{0%,17%,76%,93%,100%{fill:#d9e2bd}10%,83%{fill:#6a7f33}}
@keyframes write{0%,60%{stroke-dashoffset:1;opacity:.2}62%{opacity:1}72%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:1;opacity:.2}}
@media(prefers-reduced-motion:reduce){.moving{display:none}.cpu,.nic,.ram,.disk-write{animation:none}.cpu{fill:#6a7f33}.disk-write{stroke-dashoffset:0;opacity:1}}
</style>
