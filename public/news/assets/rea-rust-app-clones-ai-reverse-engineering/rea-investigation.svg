<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">REA investigation workflow</title>
<desc id="desc">An agent asks a question, REA routes it to a local analysis engine, and evidence with unknowns returns to the agent before a separate implementation begins.</desc>
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#171717}.small{font-size:15px}.label{font-size:17px;font-weight:700}.title{font-size:22px;font-weight:700}.ink{stroke:#171717;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.thin{stroke:#171717;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}@keyframes travel{0%,14%{transform:translate(0,0);opacity:0}22%,50%{opacity:1}63%,100%{transform:translate(0,0);opacity:0}}@keyframes return{0%,40%{opacity:0}48%,80%{opacity:1}94%,100%{opacity:0}}.packet{animation:travel 6s ease-in-out infinite}.reply{animation:return 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.packet,.reply{animation:none;opacity:1}}</style></defs>
<rect width="920" height="520" fill="#fff"/><text x="48" y="46" class="title">From a software question to inspectable evidence</text>
<path d="M86 383 479 156 842 366 449 493Z" fill="#f5f5f5" class="ink"/><path d="M86 383v29l363 211v-30Z" fill="#dedede" class="ink"/><path d="M449 493v30l393-227v-30Z" fill="#c8c8c8" class="ink"/>
<path d="M123 283 219 228 311 281 215 337Z" fill="#fff" class="ink"/><path d="M123 283v77l92 54v-77Z" fill="#eee" class="ink"/><path d="M215 337v77l96-55v-77Z" fill="#d9d9d9" class="ink"/><path d="M159 287 215 255 270 287 214 320Z" fill="#f8f8f8" class="thin"/><circle cx="214" cy="286" r="8" fill="#171717"/><text x="145" y="435" class="label">Coding agent</text><text x="151" y="457" class="small">asks a focused question</text>
<path d="M377 211 479 151 585 212 481 272Z" fill="#fff" class="ink"/><path d="M377 211v112l104 60V272Z" fill="#e8e8e8" class="ink"/><path d="M481 272v111l104-60V212Z" fill="#d1d1d1" class="ink"/><path d="m414 231 76-44 54 31-76 44Z" fill="#fff" class="thin"/><text x="433" y="235" class="label">REA / MCP</text><text x="405" y="410" class="label">Routes the investigation</text>
<path d="M651 266 737 216 813 260 727 310Z" fill="#fff" class="ink"/><path d="M651 266v59l76 44v-59Z" fill="#ececec" class="ink"/><path d="M727 310v59l86-50v-59Z" fill="#d4d4d4" class="ink"/><path d="M687 260 737 231 781 257 731 286Z" fill="#191919" class="ink"/><path d="M696 260 727 278M708 253 739 271M720 246 751 264" stroke="#fff" stroke-width="2"/><path d="M741 292v39M701 327l40 24 42-24" class="thin"/><text x="653" y="405" class="label">Local analysis tool</text><text x="659" y="427" class="small">Hopper · Ghidra · IDA</text>
<path d="M499 88 601 29 699 86 597 145Z" fill="#fff" class="ink"/><path d="M499 88v58l98 57v-58Z" fill="#f0f0f0" class="ink"/><path d="M597 145v58l102-58V86Z" fill="#d8d8d8" class="ink"/><path d="m534 89 21 13 25-31M534 110l21 13 25-31" class="thin"/><text x="579" y="98" class="label">Evidence</text><text x="580" y="121" class="small">+ unknowns</text>
<path d="M305 319 371 281M588 277 647 302M678 113 753 156 753 230" class="thin reply"/><circle cx="305" cy="319" r="4" fill="#171717"/><circle cx="647" cy="302" r="4" fill="#171717"/><path d="M296 292 311 283 326 292 311 301Z" fill="#171717" class="packet"/>
<path d="M51 477h27" class="thin"/><text x="88" y="483" class="small">Analysis informs a separate implementation; it does not recover original source code.</text></svg>