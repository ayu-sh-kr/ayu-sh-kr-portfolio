<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
<title id="title">The clean-room implementation boundary</title>
<desc id="desc">A commercial application can be studied through visible behavior and public specifications. An independent team writes new code for an alternative. Review still needs to consider protected expression, branding, formats and legal context.</desc>
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#171717}.small{font-size:15px}.label{font-size:17px;font-weight:700}.title{font-size:22px;font-weight:700}.ink{stroke:#171717;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}.thin{stroke:#171717;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}@keyframes observe{0%,12%{opacity:0}20%,40%{opacity:1}52%,100%{opacity:0}}@keyframes build{0%,43%{opacity:0}55%,82%{opacity:1}95%,100%{opacity:0}}.token{animation:observe 7s ease-in-out infinite}.newcode{animation:build 7s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.token,.newcode{animation:none;opacity:1}}</style></defs>
<rect width="920" height="510" fill="#fff"/><text x="46" y="44" class="title">A familiar workflow can have a different implementation</text>
