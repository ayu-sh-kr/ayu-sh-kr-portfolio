<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Evaluate Gemini models by the work they need to do</title><desc id="desc">An illustrative evaluation workflow, not a measured routing system. A task tray connects across one isometric base to three candidate workstations: Carbon for deeper investigation, Argon for everyday work and Hydrogen for faster execution. Each path ends at the same review bench. Compare candidates against the current model using consistent tasks and tests, judging correctness, review effort and cost. Connections show alternatives, not a required sequence.</desc><rect x="1" y="1" width="758" height="648" rx="20" fill="#101011" stroke="#3e3e41"/><g font-family="Arial,sans-serif"><text x="30" y="44" fill="#f7f7f6" font-size="28" font-weight="600">Different jobs, one standard of review</text><text x="30" y="76" fill="#c4c4c7" font-size="19">Illustrative choices based on Google’s positioning</text><polygon points="655.1,360.0 421.2,495.0 421.2,509.0 655.1,374.0" fill="#29292d" stroke="#96969c" stroke-width="1.2" stroke-linejoin="round"/><polygon points="66.2,290.0 421.2,495.0 421.2,509.0 66.2,304.0" fill="#3d3d42" stroke="#96969c" stroke-width="1.2" stroke-linejoin="round"/><polygon points="300.0,155.0 655.1,360.0 421.2,495.0 66.2,290.0" fill="#606066" stroke="#96969c" stroke-width="1.2" stroke-linejoin="round"/><polyline points="255.0,263.0 282.7,279.0 363.2,232.5 393.5,250.0" fill="none" stroke="#d8d8dc" stroke-width="2" stroke-linejoin="round"/><polyline points="282.7,279.0 313.0,296.5" fill="none" stroke="#d8d8dc" stroke-width="2" stroke-linejoin="round"/><polyline points="282.7,279.0 202.1,325.5 232.5,343.0" fill="none" stroke="#d8d8dc" stroke-width="2" stroke-linejoin="round"/><polyline points="461.1,289.0 493.1,307.5 412.6,354.0 451.6,376.5" fill="none" stroke="#d8d8dc" stroke-width="2" stroke-linejoin="round"/><polyline points="380.5,335.5 412.6,3