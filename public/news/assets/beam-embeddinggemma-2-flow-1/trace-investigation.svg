<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">flow-1 finds an unsupported completion report</title><desc id="desc">An agent edits code, runs tests and reports all tests passed. The recorded output shows two failures. flow-1 inspects the evidence and flags the contradiction.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.5"/></marker></defs><rect width="1000" height="550" rx="28" fill="#fafaf8"/><g font-family="Arial, Helvetica, sans-serif" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="48" font-size="28" text-anchor="start" fill="#1d1d1f" stroke="none">flow-1</text><text x="40" y="79" font-size="18" text-anchor="start" fill="#6e6e73" stroke="none">Agent run → evidence → finding</text><g transform="translate(500 359) matrix(.866 .5 -.866 .5 0 0)"><rect x="-365.0" y="-150.0" width="730" height="300" rx="18" fill="#f1f1ed" stroke="#e1e1db" stroke-width="1"/><path d="M-335 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M-295 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M-255 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M-215 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M-175 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M-135 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M-95 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M-55 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M-15 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M25 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M65 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M105 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M145 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M185 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M225 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M265 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M305 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /><path d="M345 -140.0 V140.0" fill="none" stroke="#e1e1db" stroke-width="1" /></g><path d="M160 306 H219" fill="none" stroke="#5d702d" stroke-width="3" marker-end="url(#arr)"/><path d="M320 306 H379" fill="none" stroke="#5d702d" stroke-width="3" marker-end="url(#arr)"/><path d="M480 306 H536" fill="none" stroke="#5d702d" stroke-width="3" marker-end="url(#arr)"/><path d="M60.0 306 L110 338.0 L160.0 306 v14 L110 352.0 L60.0 320 Z" fill="#ecf0df" stroke="#1d1d1f"/><path d="M110 338.0 v14" stroke="#1d1d1f"/><path d="M110 274.0 L160.0 306 L110 338.0 L60.0 306 Z" fill="white" stroke="#1d1d1f"/><path d="M98 291 l-9,9 9,9 M122 291 l9,9 -9,9 M114 286 l-8,28" fill="none" stroke="#1d1d1f" stroke-width="2" /><text x="110" y="382" font-size="20" text-anchor="middle" fill="#1d1d1f" stroke="none">Request</text><path d="M220.0 306 L270 338.0 L320.0 306 v14 L270 352.0 L220.0 320 Z" fill="#ecf0df" stroke="#1d1d1f"/><path d="M270 338.0 v14" stroke="#1d1d1f"/><path d="M270 274.0 L320.0 306 L270 338.0 L220.0 306 Z" fill="white" stroke="#1d1d1f"/><path d="M258 291 l-9,9 9,9 M282 291 l9,9 -9,9 M274 286 l-8,28" fill="none" stroke="#1d1d1f" stroke-width="2" /><text x="270" y="382" font-size="20" text-anchor="middle" fill="#1d1d1f" stroke="none">Edit</text><path d="M380.0 306 L430 338.0 L480.0 306 v14 L430 352.0 L380.0 320 Z" fill="#ecf0df" stroke="#1d1d1f"/><path d="M430 338.0 v14" stroke="#1d1d1f"/><path d="M430 274.0 L480.0 306 L430 338.0 L380.0 306 Z" fill="white" stroke="#1d1d1f"/><path d="M418 291 l-9,9 9,9 M442 291 l9,9 -9,9 M434 286 l-8,28" fill="none" stroke="#1d1d1f" stroke-width="2" /><text x="430" y="382" font-size="20" text-anchor="middle" fill="#1d1d1f" stroke="none">Tests</text><path d="M537.5 306 L600 344.0 L662.5 306 v14 L600 358.0 L537.5 320 Z" fill="#ecf0df" stroke="#1d1d1f"/><path d="M600 344.0 v14" stroke="#1d1d1f"/><path d="M600 268.0 L662.5 306 L600 344.0 L537.5 306 Z" fill="white" stroke="#1d1d1f"/><rect x="544" y="165" width="132" height="138" rx="14" fill="white"/><text x="560" y="194" font-size="18" text-anchor="start" fill="#1d1d1f" stroke="none">Agent says</text><path d="M556 209 H664" fill="none" stroke="#d8d1c5" stroke-width="1" /><text x="560" y="235" font-size="16" text-anchor="start" fill="#1d1d1f" stroke="none">“All tests</text><text x="560" y="260" font-size="16" text-anchor="start" fill="#1d1d1f" stroke="none">passed.”</text><text x="610" y="415" font-size="20" text-anchor="middle" fill="#1d1d1f" stroke="none">Completion</text><rect x="329" y="143" width="166" height="116" rx="14" fill="white"/><text x="345" y="172" font-size="18" text-anchor="start" fill="#1d1d1f" stroke="none">Test output</text><path d="M341 187 H483" fill="none" stroke="#d8d1c5" stroke-width="1" /><text x="345" y="213" font-size="16" text-anchor="start" fill="#1d1d1f" stroke="none">Passed: 18</text><text x="345" y="238" font-size="16" text-anchor="start" fill="#1d1d1f" stroke="none">Failed: 2</text><path d="M430 259 V274" fill="none" stroke="#6e6e73" stroke-width="1.5" /><circle cx="475" cy="235" r="22" fill="#ecf0df" fill-opacity=".25" stroke="#5d702d" stroke-width="4"/><path d="M491 251 L511 271" fill="none" stroke="#5d702d" stroke-width="9" /><path d="M495 195 H520 V116 H732 V245 H759" fill="none" stroke="#5d702d" stroke-width="3" marker-end="url(#arr)"/><path d="M676 198 H704 V218 H759" fill="none" stroke="#5d702d" stroke-width="3" marker-end="url(#arr)"/><path d="M757.0 353 L850 403.0 L943.0 353 v18 L850 421.0 L757.0 371 Z" fill="#ecf0df" stroke="#1d1d1f"/><path d="M850 403.0 v18" stroke="#1d1d1f"/><path d="M850 303.0 L943.0 353 L850 403.0 L757.0 353 Z" fill="white" stroke="#1d1d1f"/><rect x="759" y="155" width="189" height="178" rx="14" fill="white"/><text x="775" y="184" font-size="18" text-anchor="start" fill="#1d1d1f" stroke="none">Finding</text><path d="M771 199 H936" fill="none" stroke="#d8d1c5" stroke-width="1" /><text x="775" y="225" font-size="16" text-anchor="start" fill="#1d1d1f" stroke="none">Report contradicts</text><text x="775" y="250" font-size="16" text-anchor="start" fill="#1d1d1f" stroke="none">the test output.</text><text x="775" y="275" font-size="16" text-anchor="start" fill="#1d1d1f" stroke="none"></text><text x="775" y="300" font-size="16" text-anchor="start" fill="#1d1d1f" stroke="none">Evidence: 2 failures</text><text x="850" y="445" font-size="20" text-anchor="middle" fill="#1d1d1f" stroke="none">Review evidence</text><text x="40" y="518" font-size="18" text-anchor="start" fill="#1d1d1f" stroke="none">Reads model calls, tool calls and results</text></g></svg>