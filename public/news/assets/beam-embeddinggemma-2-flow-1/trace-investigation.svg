<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">flow-1 scans an agent trace and flags a mismatch</title><desc id="desc">An animated inspection sheet scans edit, tests and report records. The tests record two failures while the completion report claims all passed. A finding travels to an evidence folio and its indicator lights up after inspection.</desc><style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.5"/></marker></defs><rect width="900" height="450" rx="24" fill="#fafaf8"/><g stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><text x="26" y="35" fill="#1d1d1f" stroke="none" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start">flow-1</text><text x="874" y="35" fill="#6e6e73" stroke="none" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="end">Inspect steps · compare evidence · flag errors</text><polygon points="119.06,223.00 370.21,368.00 370.21,356.00 119.06,211.00" fill="#ecf0df" stroke="#1d1d1f" /><polygon points="465.47,313.00 370.21,368.00 370.21,356.00 465.47,301.00" fill="#d9e2bd" stroke="#1d1d1f" /><polygon points="214.33,156.00 465.47,301.00 370.21,356.00 119.06,211.00" fill="white" stroke="#1d1d1f" /><polyline points="203.07,172.50 434.30,306.00" fill="none" stroke="#b7b9b0" stroke-width="2" /><polyline points="146.78,205.00 378.00,338.50" fill="none" stroke="#b7b9b0" stroke-width="2" /><polygon points="160.63,211.00 223.85,247.50 223.85,239.50 160.63,203.00" fill="#ecf0df" stroke="#1d1d1f" /><polygon points="266.29,223.00 223.85,247.50 223.85,239.50 266.29,215.00" fill="#d9e2bd" stroke="#1d1d1f" /><polygon points="203.07,178.50 266.29,215.00 223.85,239.50 160.63,203.00" fill="white" stroke="#1d1d1f" /><g trans