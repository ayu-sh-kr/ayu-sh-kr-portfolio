<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Evidence based agent trace investigation</title><desc id="desc">The agent request, tool call and result are recorded. A magnifier inspects the result and connects it to a finding with supporting evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.5"/></marker></defs><rect width="900" height="420" rx="24" fill="#fafaf8"/><g font-family="Arial, Helvetica, sans-serif" stroke="#1d1d1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><text stroke="none" x="38" y="46" text-anchor="start" font-size="24" fill="#1d1d1f">flow-1: inspect the steps behind the answer</text><path d="M181 210 L218 210" fill="none" stroke="#5d702d" stroke-width="3" marker-end="url(#arrow)"/><polygon points="76.5,210 128,243.0 128,256.0 76.5,223" fill="#ecf0df" stroke="#1d1d1f"/><polygon points="128,243.0 179.5,210 179.5,223 128,256.0" fill="#d9e2bd" stroke="#1d1d1f"/><polygon points="128,177.0 179.5,210 128,243.0 76.5,210" fill="white" stroke="#1d1d1f"/><path d="M114,199 h28 M114,206 h20 M114,213 h24"/><text stroke="none" x="128" y="290" text-anchor="middle" font-size="20" fill="#1d1d1f">Request</text><path d="M326 210 L363 210" fill="none" stroke="#5d702d" stroke-width="3" marker-end="url(#arrow)"/><polygon points="221.5,210 273,243.0 273,256.0 221.5,223" fill="#ecf0df" stroke="#1d1d1f"/><polygon points="273,243.0 324.5,210 324.5,223 273,256.0" fill="#d9e2bd" stroke="#1d1d1f"/><polygon points="273,177.0 324.5,210 273,243.0 221.5,210" fill="white" stroke="#1d1d1f"/><path d="M263,199 l-8,7 8,7 M283,199 l8,7 -8,7 M276,195 l-6,22" fill="none" stroke="#1d1d1f"/><text stroke="none" x="273" y="290" text-anchor="middle" font-size="20" fill="#1d1d1f">Tool call</text><polygon points="366.5,210 418,243.0 418,256.0 366.5,223" fill="#ecf0df" stroke="#1d1d1f"/><polygon points="418,243.0 469.5,210 469.5,223 418,256.0" fill="#d9e2bd" stroke="#1d1d1f"/><polygon points="418,177.0 469.5,210 418,243.0 366.5,210" fill="white" stroke="#1d1d1f"/><path d="M404,199 h28 M404,206 h20 M404,213 h24"/><text stroke="none" x="418" y="290" text-anchor="middle" font-size="20" fill="#1d1d1f">Result</text><circle cx="430" cy="185" r="43" fill="#ecf0df" fill-opacity=".65" stroke="#5d702d" stroke-width="4"/><path d="M462 217 L495 249" stroke="#5d702d" stroke-width="10"/><path d="M425 169 V190" stroke="#5d702d" stroke-width="4"/><circle cx="425" cy="200" r="2" fill="#5d702d" stroke="none"/><path d="M473 197 L545 197 L596 216" fill="none" stroke="#5d702d" stroke-width="3" marker-end="url(#arrow)"/><polygon points="605.0,222 690,272.0 690,286.0 605.0,236" fill="#ecf0df" stroke="#1d1d1f"/><polygon points="690,272.0 775.0,222 775.0,236 690,286.0" fill="#d9e2bd" stroke="#1d1d1f"/><polygon points="690,172.0 775.0,222 690,272.0 605.0,222" fill="white" stroke="#1d1d1f"/><g transform="translate(620 114)"><rect width="148" height="126" rx="13" fill="white"/><path d="M15 35 H131 M15 63 H116 M15 79 H95" stroke="#b4b4b0"/><text stroke="none" x="74" y="24" text-anchor="middle" font-size="19" fill="#1d1d1f">Finding</text><circle cx="22" cy="101" r="5" fill="#5d702d" stroke="none"/><text stroke="none" x="84" y="107" text-anchor="middle" font-size="16" fill="#1d1d1f">Evidence</text></g><text stroke="none" x="690" y="322" text-anchor="middle" font-size="20" fill="#1d1d1f">Check the claim</text><text stroke="none" x="38" y="377" text-anchor="start" font-size="20" fill="#1d1d1f">Recorded actions → investigation → supported finding</text></g></svg>