<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="cobbledb-title cobbledb-desc">
  <title id="cobbledb-title">CobbleDB read path: how a page lookup flows from query to content</title>
  <desc id="cobbledb-desc">A four-step flow: retrieval and ranking produce candidate page keys, a stateless router hashes the keys to partition replicas, data nodes batch-read passages and embeddings from RocksDB on memory or NVMe, and the content returns to the model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5d702d"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="752" height="332" rx="18" fill="#f8faf2" stroke="#d9e2bd" stroke-width="2"/>

  <!-- Row 1: three main stages -->
  <g font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive" fill="#242c12">
    <!-- Stage 1 -->
    <rect x="30" y="70" width="205" height="96" rx="12" fill="#ecf0df" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-dasharray="0"/>
    <text x="46" y="94" font-size="12" letter-spacing="2" fill="#5d702d" font-family="ui-monospace,monospace">STEP 01</text>
    <text x="46" y="116" font-size="17" font-weight="bold">Retrieval + ranking</text>
    <text x="46" y="138" font-size="12.5">Candidate pages picked</text>
    <text x="46" y="154" font-size="12.5">for the query</text>

    <!-- Stage 2 -->
    <rect x="278" y="70" width="205" height="96" rx="12" fill="#ecf0df" stroke="#5d702d" stroke-width="2" stroke-linecap="round"/>
    <text x="294" y="94" font-size="12" letter-spacing="2" fill="#5d702d" font-family="ui-monospace,monospace">STEP 02</text>
    <text x="294" y="116" font-size="17" font-weight="bold">Stateless router</text>
    <text x="294" y="138" font-size="12.5">Hashes keys to partitions,</text>
    <text x="294" y="154" font-size="12.5">prefers same-zone replica</text>

    <!-- Stage 3 -->
    <rect x="526" y="70" width="205" height="96" rx="12" fill="#ecf0df" stroke="#5d702d" stroke-width="2" stroke-linecap="round"/>
    <text x="542" y="94" font-size="12" letter-spacing="2" fill="#5d702d" font-family="ui-monospace,monospace">STEP 03</text>
    <text x="542" y="116" font-size="16" font-weight="bold">Data nodes · 3 replicas</text>
    <text x="542" y="138" font-size="12.5">RocksDB MultiGet; memory</text>
    <text x="542" y="154" font-size="12.5">cache, NVMe for the rest</text>

    <!-- Stage 4 -->
    <rect x="278" y="240" width="205" height="74" rx="12" fill="#ecf0df" stroke="#5d702d" stroke-width="2" stroke-linecap="round"/>
    <text x="294" y="264" font-size="12" letter-spacing="2" fill="#5d702d" font-family="ui-monospace,monospace">STEP 04</text>
    <text x="294" y="286" font-size="17" font-weight="bold">Passages + embeddings</text>
    <text x="294" y="304" font-size="12.5">handed to the model</text>
  </g>

  <!-- Connectors -->
  <g fill="none" stroke="#5d702d" stroke-width="2.5" stroke-linecap="round">
    <path d="M240 118 h32" marker-end="url(#arrow)"/>
    <path d="M488 118 h32" marker-end="url(#arrow)"/>
    <path d="M628 172 v52 q0 14 -14 14 h-126" marker-end="url(#arrow)"/>
  </g>

  <!-- Side note: what was omitted -->
  <g font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive">
    <rect x="30" y="240" width="205" height="74" rx="12" fill="#f8faf2" stroke="#92a951" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="46" y="264" font-size="12" letter-spacing="2" fill="#5d702d" font-family="ui-monospace,monospace">SKIPPED</text>
    <text x="46" y="286" font-size="13" fill="#242c12">No transactions, no synced</text>
    <text x="46" y="304" font-size="13" fill="#242c12">replicas — reads tolerate lag</text>
  </g>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#242c12" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive">CobbleDB: the tunable read path</text>
</svg>
