<svg xmlns="http://www.w3.org/2000/svg" width="680" height="498" viewBox="0 0 680 498" role="img" aria-labelledby="title desc">
<title id="title">Inside Blink’s inference loop</title>
<desc id="desc">An HTTP request enters the BlueField network processor. Its RDMA link delivers input to the H100. A persistent scheduler batches work and reuses attention data. Output tokens travel back to BlueField for streaming. The host loads the model at startup.</desc>
<style>text{font-family:Arial,sans-serif;fill:#f4f3f0}.sub{fill:#c0c0c1;font-size:18px}.label{font-size:22px;font-weight:bold}.wire{fill:none;stroke:#c7c7c9;stroke-width:2;stroke-linejoin:round}.leader{fill:none;stroke:#99999e;stroke-width:1.3}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
<rect width="680" height="498" rx="18" fill="#222225"/>
<text x="26" y="42" font-size="27" font-weight="bold">Inside Blink’s inference loop</text>
<text x="26" y="70" class="sub">At startup, the host loads the model and records its GPU operations.</text>
