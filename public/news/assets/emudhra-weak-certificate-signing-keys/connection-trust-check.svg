<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">Where a connection could be fooled</title><desc id="desc">A possible attack needs both recovered signing authority and interception. The client either rejects the compromised chain or accepts the impersonator.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#afafac"/></marker></defs>
<rect width="760" height="540" rx="12" fill="#101011"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#fafaf8">
<text x="28" y="40" font-size="24" font-weight="700">Where a connection could be fooled</text>
<path d="M358 125H402" fill="none" stroke="#afafac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M567 180V240" fill="none" stroke="#afafac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M402 295H358" fill="none" stroke="#afafac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M110 350V410" fill="none" stroke="#afafac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M276 350V380H567V410" fill="none" stroke="#afafac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="70" width="330" height="110" rx="7" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="44" y="98" font-size="16" fill="#afafac">1 · CONNECTION BEGINS</text><text x="44" y="129" font-size="20" font-weight="600">App contacts payment site</text><text x="44" y="157" font-size="17">Before sending payment data</text>
<rect x="402" y="70" width="330" height="110" rx="7" fill="#2c2722" stroke="#ff9870" stroke-width="2.5"/><text x="418" y="98" font-size="16" fill="#ff9870">2 · SEPARATE REQUIREMENT</text><text x="418" y="129" font-size="20" font-weight="600">Attacker intercepts the path</text><text x="418" y="157" font-size="17">Traffic must reach the attacker</text>
<rect x="402" y="240" width="330" height="110" rx="7" fill="#2c2722" stroke="#ff9870" stroke-width="2.5"/><text x="418" y="268" font-size="16" fill="#ff9870">3 · FORGED IDENTITY</text><text x="418" y="299" font-size="20" font-weight="600">Present a fake certificate</text><text x="418" y="327" font-size="17">Signed with recovered CA key</text>
<rect x="28" y="240" width="330" height="110" rx="7" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="44" y="268" font-size="16" fill="#afafac">4 · CLIENT CHECKS TRUST</text><text x="44" y="299" font-size="20" font-weight="600">Is this chain still accepted?</text><text x="44" y="327" font-size="17">Check hostname and validity too</text>
<rect x="28" y="410" width="330" height="110" rx="7" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="44" y="438" font-size="16" fill="#afafac">BLOCKED CHAIN</text><text x="44" y="469" font-size="20" font-weight="600">Reject the connection</text><text x="44" y="497" font-size="17">Do not send the payment request</text>
<rect x="402" y="410" width="330" height="110" rx="7" fill="#2c2722" stroke="#ff9870" stroke-width="2.5"/><text x="418" y="438" font-size="16" fill="#ff9870">CHAIN STILL ACCEPTED</text><text x="418" y="469" font-size="20" font-weight="600">Trust the impersonator</text><text x="418" y="497" font-size="17">Attacker receives the request</text>
<text x="30" y="397" font-size="16" fill="#afafac">No</text>
<text x="475" y="372" font-size="16" fill="#afafac">Yes</text>
<text x="28" y="210" font-size="16" fill="#afafac">This scenario needs both signing authority and interception.</text>
</g></svg>
