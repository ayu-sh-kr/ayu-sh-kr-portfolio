<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">Kiri: the path into a container</title><desc id="desc">Schematic macOS architecture. Docker tools connect to the host daemon. A vsock channel connects it to the Linux guest agent, which starts isolated container processes.</desc>
