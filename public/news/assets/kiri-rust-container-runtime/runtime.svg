<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc"><title id="title">Kiri rebuilds the container startup path</title><desc id="desc">On macOS, Docker tools send a request to the Kiri host daemon. It crosses vsock into one Linux VM. The guest agent creates isolated container processes. Packets arrive in order, followed by container activity indicators.</desc><style>text{font-family:Arial,sans-serif;fill:#f7f7f6}.label{font-size:20px;font-weight:600}.small{font-size:17px;fill:#afafac}.edge{stroke:#8b8b88;stroke-width:1.2;stroke-linejoin:round}.wire{fill:none;stroke:#d0d0cd;stroke-width:2;stroke-linejoin:round}.leader{fill:none;stroke:#6e6e73;stroke-width:1.2}.packet{fill:#fafaf8}.running{animation:run 8s infinite}@keyframes run{0%,65%,100%{opacity:.2}70%,93%{opacity:1}}@media(prefers-reduced-motion:reduce){.packet{display:none}.running{animation:none;opacity:1}}</style><rect x="1" y="1" width="758" height="658" rx="20" fill="#101011" stroke="#3e3e41"/><text x="30" y="44" font-size="25" font-weight="600">A shorter path into the container</text><text x="30" y="74" class="small">macOS architecture · Docker interface, Kiri engine</text>
