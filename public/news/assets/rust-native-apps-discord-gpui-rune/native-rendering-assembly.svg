<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">From Rust controls to a desktop window</title><desc id="desc">A detailed isometric assembly shows optional GPUI Kit controls and application state feeding GPUI layout and text. Glyph cache and drawing primitives feed the GPU renderer and a platform window. Operating system input and accessibility connect alongside the rendering path. Three packets travel in sequence through controls, layout and rendering.</desc><style>.packet{opacity:0}@media(prefers-reduced-motion:reduce){.packet{display:none}}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#e8e8e6"/></marker></defs>
