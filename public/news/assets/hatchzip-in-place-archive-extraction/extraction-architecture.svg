<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Hatchzip: save output before releasing archive space</title>
<desc id="desc">The CLI and desktop app use one Rust core. It saves the index, checks peak space, extracts a batch from the end, flushes output, commits its journal and trims the archive. Reclaimed space feeds the next batch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff9870" stroke-width="1.5"/></marker></defs>
<rect width="960" height="520" rx="14" fill="#101011"/>
<g font-family="'DM Sans',Arial,sans-serif" fill="#fafaf8">
<text x="36" y="43" font-size="25" font-weight="700">Extract. Commit. Reclaim.</text>
<text x="36" y="73" font-size="17" fill="#afafac">Desktop / CLI → shared Rust core · ordinary ZIP / 7z / tar path</text>
<path d="M44 106 L292 107 Q296 107 296 114 L295 232 Q295 238 287 238 L42 237 Q36 237 36 229 L37 114 Q37 106 44 106 Z" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="54" y="133" font-size="13" font-weight="700" fill="#ff9870">01 / FORMAT READER</text><text x="54" y="164" font-size="20" font-weight="700">Save the index</text><text x="54" y="193" font-size="17" fill="#d0d0cd">Keep archive metadata</text><text x="54" y="218" font-size="17" fill="#d0d0cd">in a separate side file.</text><path d="M358 106 L606 107 Q610 107 610 114 L609 232 Q609 238 601 238 L356 237 Q350 237 350 229 L351 114 Q351 106 358 106 Z" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="368" y="133" font-size="13" font-weight="700" fill="#ff9870">02 / SPACE PLANNER</text><text x="368" y="164" font-size="20" font-weight="700">Check the peak</text><text x="368" y="193" font-size="17" fill="#d0d0cd">Model output growth</text><text x="368" y="218" font-size="17" fill="#d0d0cd">and space reclaimed.</text><path d="M672 106 L920 107 Q924 107 924 114 L923 232 Q923 238 915 238 L670 237 Q664 237 664 229 L665 114 Q665 106 672 106 Z" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="682" y="133" font-size="13" font-weight="700" fill="#ff9870">03 / WORKER POOL</text><text x="682" y="164" font-size="20" font-weight="700">Extract last batch</text><text x="682" y="193" font-size="17" fill="#d0d0cd">Decode, check integrity,</text><text x="682" y="218" font-size="17" fill="#d0d0cd">write output files.</text><path d="M672 280 L920 281 Q924 281 924 288 L923 406 Q923 412 915 412 L670 411 Q664 411 664 403 L665 288 Q665 280 672 280 Z" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="682" y="307" font-size="13" font-weight="700" fill="#ff9870">04 / FILESYSTEM</text><text x="682" y="338" font-size="20" font-weight="700">Flush the output</text><text x="682" y="367" font-size="17" fill="#d0d0cd">Make files durable</text><text x="682" y="392" font-size="17" fill="#d0d0cd">before freeing input.</text><path d="M358 280 L606 281 Q610 281 610 288 L609 406 Q609 412 601 412 L356 411 Q350 411 350 403 L351 288 Q351 280 358 280 Z" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="368" y="307" font-size="13" font-weight="700" fill="#ff9870">05 / PROGRESS JOURNAL</text><text x="368" y="338" font-size="20" font-weight="700">Commit the batch</text><text x="368" y="367" font-size="17" fill="#d0d0cd">Save completed work</text><text x="368" y="392" font-size="17" fill="#d0d0cd">for crash recovery.</text><path d="M44 280 L292 281 Q296 281 296 288 L295 406 Q295 412 287 412 L42 411 Q36 411 36 403 L37 288 Q37 280 44 280 Z" fill="#1d1d1f" stroke="#545457" stroke-width="1.5"/><text x="54" y="307" font-size="13" font-weight="700" fill="#ff9870">06 / ARCHIVE STORAGE</text><text x="54" y="338" font-size="20" font-weight="700">Trim the archive</text><text x="54" y="367" font-size="17" fill="#d0d0cd">Release consumed bytes;</text><text x="54" y="392" font-size="17" fill="#d0d0cd">remove empty volumes.</text></g><g stroke="#ff9870" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#arrow)"><path d="M296 172 H350"/><path d="M610 172 H664"/><path d="M794 238 V280"/><path d="M664 346 H610"/><path d="M350 346 H296"/><path d="M166 412 V446 H932 V172 H924"/></g><text x="480" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#afafac">Freed space is reused for the next batch on the same filesystem.</text><text x="480" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#afafac">Streaming and compressed-tar paths use additional durable checkpoints.</text></svg>