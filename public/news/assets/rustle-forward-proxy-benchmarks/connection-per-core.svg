<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">One connection stays on one core</title>
<desc id="desc">Isometric board with a client, two separate Rustle worker lanes and upstream origins. A highlighted connection enters at the client, takes the kernel branch to core 2, and reaches an origin through the same worker lane.</desc>
<style>
text { font: 650 23px system-ui, sans-serif; fill: #242c12; }
.heading { font-size: 31px; font-weight: 700; }
.note { font-size: 20px; font-weight: 500; }
.edge { stroke: #5d702d; stroke-width: 1.5; stroke-linejoin: round; }
.route { fill: none; stroke: #65783c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.active { stroke: #395222; stroke-width: 3; }
.leader { fill: none; stroke: #73864c; stroke-width: 1.4; }
.packet { fill: #354c22; stroke: #f8faf2; stroke-width: 1.5; }
@media (prefers-reduced-motion: reduce) { .packet { display: none; } }
</style>
