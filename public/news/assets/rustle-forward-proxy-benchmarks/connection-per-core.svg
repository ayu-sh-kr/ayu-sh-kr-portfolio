<svg xmlns="http://www.w3.org/2000/svg" width="720" height="478" viewBox="0 0 720 478" role="img" aria-labelledby="title desc">
<title id="title">Rustle keeps each request stream on its assigned core</title>
<desc id="desc">A centered isometric assembly shows two persistent client connections branching at the kernel onto separate Rustle workers. Each raised worker module shows a listening socket, an event loop and a row of upstream connection pool slots. Repeated requests follow each connection’s solid or dashed path to an upstream origin.</desc>
