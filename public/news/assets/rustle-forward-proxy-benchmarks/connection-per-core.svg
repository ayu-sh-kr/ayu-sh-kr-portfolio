.active { stroke: #dededf; stroke-width: 3; }
.leader { fill: none; stroke: #a2a2a4; stroke-width: 1.4; }
.packet { fill: #f7f7f6; stroke: #101011; stroke-width: 1.5; }
@media (prefers-reduced-motion: reduce) { .packet { display: none; } }
</style>
