<svg xmlns="http://www.w3.org/2000/svg" width="720" height="418" viewBox="0 0 720 418" role="img" aria-labelledby="title desc">
<title id="title">From virtual topic to Kafka broker</title>
<desc id="desc">An order service sends a Kafka request for orders to Kawa. Kawa maps the virtual name to orders-v2 and sends the request to the Kafka broker. The two dashed paths connect three isometric components in sequence.</desc>
<style>
text { font-family: Arial, sans-serif; font-size: 20px; fill: #f7f7f6; }
.heading { font-size: 26px; font-weight: 600; }
.note { font-size: 18px; fill: #d0d0cd; }
.hardware { stroke: #858589; stroke-width: 1.4; stroke-linejoin: round; }
.leader { fill: none; stroke: #a2a2a4; stroke-width: 1.3; }
.rail { fill: none; stroke: #f7f7f6; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 5 5; }
.packet { fill: #f7f7f6; stroke: #101011; stroke-width: 1.4; }
@media (prefers-reduced-motion: reduce) { .packet { display: none; } }
</style>
