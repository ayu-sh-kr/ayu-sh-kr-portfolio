<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Rune’s rendering pipeline</title>
<desc id="desc">Three isometric stations show how Rust views feed Taffy layout, then send scene updates to the renderer, which animates and draws the interface on the GPU.</desc>
