<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 650" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Thought interface review loop</title>
  <desc id="diagram-description">Intention is captured as a neural signal, interpreted, represented, reviewed, and acted upon. A dashed return path shows that action begins a new intentional cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#5d702d"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#242c12" flood-opacity=".10"/></filter>
  </defs>
  <rect width="820" height="650" rx="24" fill="#f8faf2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><text x="40" y="45" font-size="24" font-weight="700" fill="#242c12">A thought interface loop</text><text x="40" y="68" font-size="14" fill="#4c5c25">Intent becomes an output only after interpretation and review.</text></g>
  <g id="nodes" font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <g id="intention"><rect x="40" y="110" width="340" height="94" rx="14" fill="#ecf0df" stroke="#92a951" stroke-width="2"/><text x="64" y="143" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">START</text><text x="64" y="176" font-size="20" font-weight="700" fill="#242c12">Intention</text></g>
    <g id="signal"><rect x="440" y="110" width="340" height="94" rx="14" fill="#fff" stroke="#d9e2bd" stroke-width="2"/><text x="464" y="143" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">CAPTURE</text><text x="464" y="176" font-size="20" font-weight="700" fill="#242c12">Neural signal</text></g>
    <g id="interpretation"><rect x="440" y="250" width="340" height="94" rx="14" fill="#d9e2bd" stroke="#92a951" stroke-width="2"/><text x="464" y="283" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4c5c25">INTERPRET</text><text x="464" y="316" font-size="20" font-weight="700" fill="#242c12">Meaning</text></g>
    <g id="representation"><rect x="40" y="250" width="340" height="94" rx="14" fill="#ecf0df" stroke="#92a951" stroke-width="2"/><text x="64" y="283" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">CREATE</text><text x="64" y="316" font-size="20" font-weight="700" fill="#242c12">Output</text></g>
    <g id="review"><rect x="40" y="390" width="340" height="94" rx="14" fill="#fff" stroke="#d9e2bd" stroke-width="2"/><text x="64" y="423" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">CHECK</text><text x="64" y="456" font-size="20" font-weight="700" fill="#242c12">Review</text></g>
    <g id="action"><rect x="440" y="390" width="340" height="94" rx="14" fill="#d9e2bd" stroke="#92a951" stroke-width="2"/><text x="464" y="423" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4c5c25">COMMIT</text><text x="464" y="456" font-size="20" font-weight="700" fill="#242c12">Action</text></g>
  </g>
  <g id="main-flow" fill="none" stroke="#5d702d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"><path d="M380 157H440"/><path d="M610 204V250"/><path d="M440 297H380"/><path d="M210 344V390"/><path d="M380 437H440"/></g>
  <g id="next-intention-loop" fill="none" stroke="#5d702d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"><path d="M780 437H800V550H20V157H40"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#5d702d"><path d="M280 594h26" stroke="#5d702d" stroke-width="3" stroke-dasharray="8 7"/><text x="316" y="599" font-size="13" font-weight="700">action informs the next intention</text></g>
</svg>
