<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 670" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">BCI signal and co-adaptation loop</title>
  <desc id="diagram-description">Neural activity is captured, prepared, decoded, represented, and reviewed through user feedback. A dashed return path shows how feedback calibrates the next signal cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#5d702d"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#242c12" flood-opacity=".10"/></filter>
  </defs>
  <rect width="820" height="670" rx="24" fill="#f8faf2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><text x="40" y="45" font-size="24" font-weight="700" fill="#242c12">How a BCI turns signals into feedback</text><text x="40" y="68" font-size="14" fill="#4c5c25">Capture → prepare → decode → represent → adapt</text></g>
  <g id="nodes" font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <g id="neural-activity"><rect x="40" y="110" width="340" height="94" rx="14" fill="#ecf0df" stroke="#92a951" stroke-width="2"/><text x="64" y="143" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">INPUT</text><text x="64" y="176" font-size="20" font-weight="700" fill="#242c12">Neural activity</text></g>
    <g id="signal-acquisition"><rect x="440" y="110" width="340" height="94" rx="14" fill="#fff" stroke="#d9e2bd" stroke-width="2"/><text x="464" y="143" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">CAPTURE</text><text x="464" y="176" font-size="20" font-weight="700" fill="#242c12">Signal acquisition</text></g>
    <g id="signal-processing"><rect x="440" y="250" width="340" height="94" rx="14" fill="#fff" stroke="#d9e2bd" stroke-width="2"/><text x="464" y="283" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">PREPARE</text><text x="464" y="316" font-size="19" font-weight="700" fill="#242c12">Filter and extract features</text></g>
    <g id="ai-decoding"><rect x="40" y="250" width="340" height="94" rx="14" fill="#d9e2bd" stroke="#92a951" stroke-width="2"/><text x="64" y="283" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4c5c25">INTERPRET</text><text x="64" y="316" font-size="20" font-weight="700" fill="#242c12">AI decoding</text></g>
    <g id="output"><rect x="40" y="390" width="340" height="94" rx="14" fill="#ecf0df" stroke="#92a951" stroke-width="2"/><text x="64" y="423" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">REPRESENT</text><text x="64" y="456" font-size="19" font-weight="700" fill="#242c12">Text, movement, or sound</text></g>
    <g id="feedback"><rect x="440" y="390" width="340" height="94" rx="14" fill="#d9e2bd" stroke="#92a951" stroke-width="2"/><text x="464" y="423" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4c5c25">ADAPT</text><text x="464" y="456" font-size="19" font-weight="700" fill="#242c12">User feedback and adaptation</text></g>
  </g>
  <g id="main-flow" fill="none" stroke="#5d702d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"><path d="M380 157H440"/><path d="M610 204V250"/><path d="M440 297H380"/><path d="M210 344V390"/><path d="M380 437H440"/></g>
  <g id="feedback-loop" fill="none" stroke="#5d702d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"><path d="M780 437H800V570H20V157H40"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#5d702d"><path d="M310 615h26" stroke="#5d702d" stroke-width="3" stroke-dasharray="8 7"/><text x="346" y="620" font-size="13" font-weight="700">calibration feedback shapes the next cycle</text></g>
</svg>
