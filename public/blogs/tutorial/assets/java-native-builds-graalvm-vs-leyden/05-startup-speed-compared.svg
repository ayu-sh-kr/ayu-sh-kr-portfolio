<text x="520.0" y="86" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="normal" font-style="normal" fill-opacity="0.62">when each one starts answering, and how fast it answers</text>
