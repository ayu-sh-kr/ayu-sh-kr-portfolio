<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The same chart, three times over</title>
<desc>A line chart comparing three startup strategies, with time since launch on the horizontal axis and speed on the vertical axis. The native binary line lifts off almost immediately at around fifty milliseconds and stays flat slightly below full speed. The JVM with an AOT cache lifts off at around one second and climbs to full speed fairly quickly. The plain JVM does not start answering until around three seconds, then climbs slowly to the highest final speed of the three.</desc>
