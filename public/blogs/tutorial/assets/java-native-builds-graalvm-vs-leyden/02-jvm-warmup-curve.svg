<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Java gets faster the longer it runs</title>
<desc>A line chart with time on the horizontal axis and speed on the vertical axis. The line starts low and flat while the JVM interprets bytecode line by line, steps up as hot methods get compiled, and flattens out at full speed once the code is running as machine code. The rising portion is shaded and labelled warm-up.</desc>
<rect width="1040" height="500" fill="#fffdf6"/>
<text x="520.0" y="56" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="30" text-anchor="middle" fill="#1e1e1e" font-weight="bold" font-style="normal" fill-opacity="1.0">Java gets faster the longer it runs</text>
<text x="520.0" y="86" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="17" text-anchor="middle" fill="#1e1e1e" font-weight="normal" font-style="normal" fill-opacity="0.62">it watches your real traffic, then optimises for what it saw</text>
<path d="M 112.3 144.7 L 748.9 144.4 L 747.5 397.8 L 111.5 397.5 Z" fill="#ffec99" fill-opacity="0.35" stroke="none"/>
<text x="430" y="128" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="19" text-anchor="middle" fill="#b45309" font-weight="bold" font-style="normal" fill-opacity="1.0">warm-up</text>
<path d="M 110.4 400.9 C 537.5 401.9, 541.2 397.3, 968.8 399.4 M 111.4 401.4 C 537.9 397.1, 540.2 397.4, 970.5 400.3" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-opacity="1.0"/>
<path d="M 109.1 399.2 C 109.6 273.1, 110.1 271.8, 108.6 141.9 M 110.0 400.5 C 113.0 274.0, 112.0 272.2, 109.9 141.3" fill="none" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" stroke-opacity="1.0"/>
<text x="970" y="434" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="16" text-anchor="end" fill="#1e1e1e" font-weight="normal" font-style="normal" fill-opacity="0.7">time the app has been running  →</text>
<text x="96" y="166" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="16" text-anchor="end" fill="#1e1e1e" font-weight="normal" font-style="normal" fill-opacity="0.7">speed</text>
<path d="M 109.6 371.4 C 191.3 371.5, 191.7 371.5, 269.5 371.0 M 111.1 372.8 C 192.0 371.9, 192.3 371.5, 268.8 371.3" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round" stroke-opacity="1.0"/>
<path d="M 269.0 372.3 C 298.0 335.2, 302.2 337.2, 330.7 299.4 M 269.1 371.4 C 301.4 334.5, 300.3 335.7, 329.0 298.9" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round" stroke-opacity="1.0"/>
<path d="M 329.3 300.6 C 423.2 295.6, 423.6 294.9, 519.1 292.3 M 331.1 300.7 C 423.6 295.5, 426.7 296.7, 519.5 292.9" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round" stroke-opacity="1.0"/>
<path d="M 519.0 293.2 C 561.3 245.2, 559.0 244.0, 599.3 199.4 M 519.0 292.2 C 559.4 245.8, 562.2 245.9, 599.4 200.2" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round" stroke-opacity="1.0"/>
<path d="M 600.2 200.9 C 677.0 196.5, 673.8 193.5, 749.2 189.2 M 600.6 201.1 C 676.8 195.5, 674.6 193.1, 749.3 191.1" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round" stroke-opacity="1.0"/>
<path d="M 748.9 191.1 C 858.8 190.6, 860.5 188.0, 969.4 188.5 M 749.2 190.5 C 860.3 190.7, 860.5 187.9, 969.0 187.3" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round" stroke-opacity="1.0"/>
<path d="M 110.8 181.4 C 539.8 180.2, 538.7 181.5, 969.0 181.5" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="8 8"/>
<text x="970" y="172" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="15" text-anchor="end" fill="#1e1e1e" font-weight="normal" font-style="normal" fill-opacity="0.65">full speed</text>
<text x="190" y="356" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="15.5" text-anchor="middle" fill="#1e1e1e" font-weight="bold" font-style="normal" fill-opacity="0.8">reading it line by line</text>
<text x="425" y="330" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="15.5" text-anchor="middle" fill="#1e1e1e" font-weight="bold" font-style="normal" fill-opacity="0.8">compiling the hot parts</text>
<text x="835" y="215" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="15.5" text-anchor="middle" fill="#1e1e1e" font-weight="bold" font-style="normal" fill-opacity="0.8">running as machine code</text>
<text x="60" y="474" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', Chalkboard, cursive" font-size="14" text-anchor="start" fill="#1e1e1e" font-weight="normal" font-style="normal" fill-opacity="0.55">Your service is at its slowest exactly when a cold container is taking its first requests.</text>
</svg>
