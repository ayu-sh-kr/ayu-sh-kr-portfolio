<svg xmlns="http://www.w3.org/2000/svg" width="640" height="494" viewBox="0 0 640 494" role="img" aria-labelledby="title desc"><title id="title">Row policies filter table access by tenant</title><desc id="desc">The checkout login has table SELECT and tenant A context. USING returns Asha and Meera while excluding Ravi from tenant B. WITH CHECK rejects new rows for another tenant. The shared login can change its context, so trusted application code must provide it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="494" rx="18" fill="#ffffff"/><g font-family="Trebuchet MS, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="40" font-size="27" font-weight="600" text-anchor="start" fill="#1d1d1f">One table, only the matching tenant</text><text x="28" y="74" font-size="21" font-weight="400" text-anchor="start" fill="#545457">checkout_app has SELECT; its tenant context is A.</text><path d="M40 110 Q173.0 108 306 111 Q319 110 318 123 L317 334 Q318 347 306 346 L40 345 Q27 346 28 334 L29 122 Q28 109 40 110 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="48" y="147" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">sales.orders</text><text x="48" y="190" font-size="23" font-weight="400" text-anchor="start" fill="#1d1d1f">Asha</text><text x="292" y="190" font-size="21" font-weight="400" text-anchor="end" fill="#1d1d1f">Tenant A</text><text x="48" y="250" font-size="23" font-weight="400" text-anchor="start" fill="#1d1d1f">Ravi</text><text x="292" y="250" font-size="21" font-weight="400" text-anchor="end" fill="#1d1d1f">Tenant B</text><path d="M44 243 L300 243" fill="none" stroke="#545457" stroke-width="1.5"/><text x="48" y="310" font-size="23" font-weight="400" text-anchor="start" fill="#1d1d1f">Meera</text><text x="292" y="310" font-size="21" font-weight="400" text-anchor="end" fill="#1d1d1f">Tenant A</text><path d="M318 225 L388 225" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="354" y="204" font-size="20" font-weight="600" text-anchor="middle" fill="#1d1d1f">RLS</text><path d="M400 151 Q500.0 149 600 152 Q613 151 612 164 L611 299 Q612 312 600 311 L400 310 Q387 311 388 299 L389 163 Q388 150 400 151 Z" fill="white" stroke="#1d1d1f" stroke-width="2"/><text x="408" y="189" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">Query result</text><text x="408" y="235" font-size="23" font-weight="400" text-anchor="start" fill="#1d1d1f">Asha</text><text x="408" y="276" font-size="23" font-weight="400" text-anchor="start" fill="#1d1d1f">Meera</text><text x="28" y="389" font-size="22" font-weight="400" text-anchor="start" fill="#1d1d1f">USING: which existing rows can it reach?</text><text x="28" y="424" font-size="22" font-weight="400" text-anchor="start" fill="#1d1d1f">WITH CHECK: does a new row match tenant A?</text><text x="28" y="467" font-size="21" font-weight="400" text-anchor="start" fill="#545457">The app must supply trusted tenant context.</text></g></svg>