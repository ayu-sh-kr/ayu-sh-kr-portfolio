<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img" aria-labelledby="title desc"><title id="title">Current grants versus future default privileges</title><desc id="desc">A GRANT updates an existing object. A default SELECT grant for shop_owner applies to future tables created as that role, including order_events. It does not apply to another creator.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="530" rx="18" fill="#ffffff"/><g font-family="Trebuchet MS, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="40" font-size="27" font-weight="600" text-anchor="start" fill="#1d1d1f">Existing tables and future tables</text><text x="28" y="72" font-size="22" font-weight="400" text-anchor="start" fill="#545457">Two grants solve two different moments.</text><text x="28" y="112" font-size="18" font-weight="600" text-anchor="start" fill="#545457">TABLES ALREADY CREATED</text><path d="M40 133 Q158.0 131 276 134 Q289 133 288 146 L287 213 Q288 226 276 225 L40 224 Q27 225 28 213 L29 145 Q28 132 40 133 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="46" y="168" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">sales.orders</text><text x="46" y="200" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Already exists</text><path d="M364 133 Q482.0 131 600 134 Q613 133 612 146 L611 213 Q612 226 600 225 L364 224 Q351 225 352 213 L353 145 Q352 132 364 133 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="370" y="168" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">shop_checkout</text><text x="370" y="200" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Gets SELECT now</text><path d="M288 178 L352 178" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="28" y="257" font-size="22" font-weight="400" text-anchor="start" fill="#1d1d1f">GRANT SELECT ON sales.orders</text><path d="M28 284 Q320 287 612 284" fill="none" stroke="#545457" stroke-width="1.5"/><text x="28" y="322" font-size="18" font-weight="600" text-anchor="start" fill="#545457">TABLES CREATED AFTER THE DEFAULT</text><path d="M40 344 Q158.0 342 276 345 Q289 344 288 357 L287 424 Q288 437 276 436 L40 435 Q27 436 28 424 L29 356 Q28 343 40 344 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="46" y="379" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">shop_owner</text><text x="46" y="411" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Creates a new table</text><path d="M364 344 Q482.0 342 600 345 Q613 344 612 357 L611 424 Q612 437 600 436 L364 435 Q351 436 352 424 L353 356 Q352 343 364 344 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="370" y="379" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">shop_checkout</text><text x="370" y="411" font-size="21" font-weight="400" text-anchor="start" fill="#545457">SELECT on creation</text><path d="M288 389 L352 389" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="28" y="469" font-size="21" font-weight="400" text-anchor="start" fill="#1d1d1f">ALTER DEFAULT PRIVILEGES FOR ROLE shop_owner</text><text x="28" y="503" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Another creator does not use this owner’s defaults.</text></g></svg>