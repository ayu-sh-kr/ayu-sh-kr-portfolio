<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" role="img" aria-labelledby="title desc"><title id="title">One checkout login inherits a growing set of permissions</title><desc id="desc">checkout_app inherits shop_checkout. The group starts empty and receives connection, read, insert, status-update and event permissions as the walkthrough progresses. shop_owner creates tables and remains separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="490" rx="18" fill="#ffffff"/><g font-family="Trebuchet MS, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="40" font-size="25" font-weight="600" text-anchor="start" fill="#1d1d1f">One login, a role that grows with the job</text><text x="28" y="74" font-size="22" font-weight="400" text-anchor="start" fill="#545457">Add each permission to shop_checkout.</text><path d="M40 107 Q153.0 105 266 108 Q279 107 278 120 L277 185 Q278 198 266 197 L40 196 Q27 197 28 185 L29 119 Q28 106 40 107 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="46" y="142" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">checkout_app</text><text x="46" y="174" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Service login</text><path d="M362 107 Q481.0 105 600 108 Q613 107 612 120 L611 185 Q612 198 600 197 L362 196 Q349 197 350 185 L351 119 Q350 106 362 107 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="368" y="142" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">shop_checkout</text><text x="368" y="174" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Permission group</text><path d="M278 152 L350 152" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="315" y="220" font-size="20" font-weight="400" text-anchor="middle" fill="#545457">inherits permissions</text><path d="M40 253 Q320.0 251 600 254 Q613 253 612 266 L611 351 Q612 364 600 363 L40 362 Q27 363 28 351 L29 265 Q28 252 40 253 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="48" y="288" font-size="23" font-weight="600" text-anchor="start" fill="#1d1d1f">The same role gains:</text><text x="48" y="321" font-size="22" font-weight="400" text-anchor="start" fill="#1d1d1f">Connect → read → create → update status</text><text x="48" y="346" font-size="22" font-weight="400" text-anchor="start" fill="#1d1d1f">Then read and append order events.</text><path d="M28 391 Q320 394 612 391" fill="none" stroke="#545457" stroke-width="1.5"/><text x="28" y="429" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">shop_owner stays separate</text><text x="28" y="462" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Creates tables; checkout cannot assume this role.</text></g></svg>