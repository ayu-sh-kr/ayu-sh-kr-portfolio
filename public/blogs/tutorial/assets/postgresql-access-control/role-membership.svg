<svg xmlns="http://www.w3.org/2000/svg" width="640" height="526" viewBox="0 0 640 526" role="img" aria-labelledby="title desc"><title id="title">Application membership and migration ownership</title><desc id="desc">The reporting login inherits shop_reader privileges and checkout inherits shop_writer privileges. A separate migration login can explicitly assume shop_owner. Neither application belongs to the owner role.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="526" rx="18" fill="#ffffff"/><g font-family="Trebuchet MS, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="40" font-size="27" font-weight="600" text-anchor="start" fill="#1d1d1f">Logins receive a job’s permissions</text><text x="28" y="72" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Keep application access separate from ownership.</text><path d="M40 108 Q153.0 106 266 109 Q279 108 278 121 L277 187 Q278 200 266 199 L40 198 Q27 199 28 187 L29 120 Q28 107 40 108 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="46" y="143" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">reporting_app</text><text x="46" y="175" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Application login</text><path d="M362 108 Q481.0 106 600 109 Q613 108 612 121 L611 187 Q612 200 600 199 L362 198 Q349 199 350 187 L351 120 Q350 107 362 108 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="368" y="143" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">shop_reader</text><text x="368" y="175" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Read approved tables</text><path d="M278 153 L350 153" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M40 240 Q153.0 238 266 241 Q279 240 278 253 L277 319 Q278 332 266 331 L40 330 Q27 331 28 319 L29 252 Q28 239 40 240 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="46" y="275" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">checkout_app</text><text x="46" y="307" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Application login</text><path d="M362 240 Q481.0 238 600 241 Q613 240 612 253 L611 319 Q612 332 600 331 L362 330 Q349 331 350 319 L351 252 Q350 239 362 240 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="368" y="275" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">shop_writer</text><text x="368" y="307" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Insert; update status</text><path d="M278 285 L350 285" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="314" y="221" font-size="19" font-weight="400" text-anchor="middle" fill="#545457">inherits</text><path d="M28 364 Q310 367 612 364" fill="none" stroke="#545457" stroke-width="1.5"/><path d="M40 393 Q320.0 391 600 394 Q613 393 612 406 L611 491 Q612 504 600 503 L40 502 Q27 503 28 491 L29 405 Q28 392 40 393 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="48" y="426" font-size="23" font-weight="600" text-anchor="start" fill="#1d1d1f">shop_migrator → SET ROLE shop_owner</text><text x="48" y="460" font-size="22" font-weight="400" text-anchor="start" fill="#1d1d1f">Creates and changes database objects.</text><text x="48" y="485" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Neither application inherits the owner role.</text></g></svg>