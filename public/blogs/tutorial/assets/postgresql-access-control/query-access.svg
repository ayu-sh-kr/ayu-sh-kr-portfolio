<svg xmlns="http://www.w3.org/2000/svg" width="640" height="462" viewBox="0 0 640 462" role="img" aria-labelledby="title desc"><title id="title">How a login reaches table data</title><desc id="desc">After authentication, the login needs database CONNECT, schema USAGE and table SELECT. An enabled row policy then filters which rows are returned.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="462" rx="18" fill="#ffffff"/><g font-family="Trebuchet MS, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="40" font-size="27" font-weight="600" text-anchor="start" fill="#1d1d1f">A connection is only the beginning</text><text x="28" y="73" font-size="21" font-weight="400" text-anchor="start" fill="#545457">The reporting login wants to read sales.orders.</text><path d="M40 108 Q160.0 106 280 109 Q293 108 292 121 L291 186 Q292 199 280 198 L40 197 Q27 198 28 186 L29 120 Q28 107 40 108 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="46" y="143" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">Connect to shop</text><text x="46" y="175" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Database: CONNECT</text><path d="M360 108 Q480.0 106 600 109 Q613 108 612 121 L611 186 Q612 199 600 198 L360 197 Q347 198 348 186 L349 120 Q348 107 360 108 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="366" y="143" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">Find sales</text><text x="366" y="175" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Schema: USAGE</text><path d="M292 152 Q319 149 348 152" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M360 260 Q480.0 258 600 261 Q613 260 612 273 L611 338 Q612 351 600 350 L360 349 Q347 350 348 338 L349 272 Q348 259 360 260 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="366" y="295" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">Read orders</text><text x="366" y="327" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Table: SELECT</text><path d="M480 198 Q482 225 480 260" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M40 260 Q160.0 258 280 261 Q293 260 292 273 L291 338 Q292 351 280 350 L40 349 Q27 350 28 338 L29 272 Q28 259 40 260 Z" fill="#f7f7f6" stroke="#1d1d1f" stroke-width="2"/><text x="46" y="295" font-size="24" font-weight="600" text-anchor="start" fill="#1d1d1f">Return rows</text><text x="46" y="327" font-size="21" font-weight="400" text-anchor="start" fill="#545457">Row policy, if enabled</text><path d="M348 304 Q320 307 292 304" fill="none" stroke="#1d1d1f" stroke-width="2.2" marker-end="url(#arrow)"/><text x="28" y="401" font-size="22" font-weight="400" text-anchor="start" fill="#1d1d1f">Each permission answers a different question.</text><text x="28" y="435" font-size="22" font-weight="400" text-anchor="start" fill="#545457">A table grant cannot replace schema access.</text></g></svg>