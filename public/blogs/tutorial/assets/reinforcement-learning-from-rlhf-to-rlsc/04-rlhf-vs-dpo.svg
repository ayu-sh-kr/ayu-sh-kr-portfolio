<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">RLHF compared with DPO</title><desc id="desc">RLHF routes preference pairs through a reward model and RL optimization while DPO trains the policy directly from preferred and rejected answers.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d702d"/></marker></defs><rect x="8" y="8" width="984" height="404" rx="28" fill="#f8faf2" stroke="#d9e2bd" stroke-width="3"/><path d="M35 55 C130 30 205 65 300 40" fill="none" stroke="#d9e2bd" stroke-width="3" stroke-dasharray="9 10"/><path d="M245 120 L305 120" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M490 120 L550 120" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M735 120 L755 120" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M155 165 C155 305 250 305 305 305" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M490 305 L755 305" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><g transform="translate(65 75)"><rect x="2" y="3" width="180" height="90" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="180" height="90" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="7 4"/><text x="90" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Preferences</text><text x="90" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">chosen / rejected</text></g><g transform="translate(310 75)"><rect x="2" y="3" width="180" height="90" rx="18" fill="#ecf0df" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="180" height="90" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="0"/><text x="90" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Reward model</text><text x="90" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">RLHF</text></g><g transform="translate(555 75)"><rect x="2" y="3" width="180" height="90" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="180" height="90" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="7 4"/><text x="90" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">RL update</text><text x="90" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">RLHF</text></g><g transform="translate(760 75)"><rect x="2" y="3" width="170" height="90" rx="18" fill="#ecf0df" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="170" height="90" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="0"/><text x="85" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Policy</text><text x="85" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">updated</text></g><g transform="translate(310 260)"><rect x="2" y="3" width="180" height="90" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="180" height="90" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="7 4"/><text x="90" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">DPO</text><text x="90" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#