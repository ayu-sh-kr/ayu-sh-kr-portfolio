<text x="44" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Preferred / rejected</text>
<path d="M382 273 Q551.0 271.5 720 273 Q732 273 732 285 L732 347 Q733 359 720 359 Q551.0 360.5 382 359 Q369 359 370 347 L370 285 Q370 273 382 273 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
