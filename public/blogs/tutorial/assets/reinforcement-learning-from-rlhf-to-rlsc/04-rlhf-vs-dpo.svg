<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">One preference dataset, two training routes</title><desc id="desc">Classic RLHF fits a reward model then performs reinforcement learning. DPO directly optimizes a model from preference pairs relative to a reference policy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="420" rx="20" fill="#f8faf2"/>
<text x="28" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5d702d">04 / REINFORCEMENT LEARNING</text>
<text x="28" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242c12">One preference dataset, two training routes</text>
<path d="M28 81 Q240 79 430 82" fill="none" stroke="#bdce8a" stroke-width="2"/>
<text x="28" y="114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5d702d">CLASSIC RLHF</text>
