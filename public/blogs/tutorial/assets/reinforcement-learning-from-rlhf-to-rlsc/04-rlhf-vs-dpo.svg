<text x="44" y="191" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Preferred / rejected</text>
<path d="M294 131 Q380.0 129.5 466 131 Q478 131 478 143 L478 205 Q479 217 466 217 Q380.0 218.5 294 217 Q281 217 282 205 L282 143 Q282 131 294 131 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="298" y="165" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Reward model</text>
<text x="298" y="191" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Fit a scoring function</text>
<path d="M548 131 Q634.0 129.5 720 131 Q732 131 732 143 L732 205 Q733 217 720 217 Q634.0 218.5 548 217 Q535 217 536 205 L536 143 Q536 131 548 131 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="552" y="165" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">RL update</text>
<text x="552" y="191" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Sample and optimize</text>
<path d="M224 174 L282 174" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M478 174 L536 174" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5d702d">DIRECT PREFERENCE OPTIMIZATION</text>
<path d="M40 273 Q126.0 271.5 212 273 Q224 273 224 285 L224 347 Q225 359 212 359 Q126.0 360.5 40 359 Q27 359 28 347 L28 285 Q28 273 40 273 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
