<text x="44" y="158" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Human comparisons</text>
<text x="44" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Rank candidate responses</text>
<path d="M464 113 Q592.0 111.5 720 113 Q732 113 732 125 L732 187 Q733 199 720 199 Q592.0 200.5 464 199 Q451 199 452 187 L452 125 Q452 113 464 113 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="468" y="136" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">2 / TRAIN THE SCORER</text>
<text x="468" y="158" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Reward model</text>
<text x="468" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Learn to predict preferences</text>
<path d="M308 156 L452 156" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M40 281 Q168.0 279.5 296 281 Q308 281 308 293 L308 355 Q309 367 296 367 Q168.0 368.5 40 367 Q27 367 28 355 L28 293 Q28 281 40 281 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="44" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">4 / OPTIMIZE</text>
<text x="44" y="326" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">LLM policy update</text>
<text x="44" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Use scores on new responses</text>
<path d="M464 281 Q592.0 279.5 720 281 Q732 281 732 293 L732 355 Q733 367 720 367 Q592.0 368.5 464 367 Q451 367 452 355 L452 293 Q452 281 464 281 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="468" y="304" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">3 / APPLY THE SCORER</text>
<text x="468" y="326" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">New response scores</text>
