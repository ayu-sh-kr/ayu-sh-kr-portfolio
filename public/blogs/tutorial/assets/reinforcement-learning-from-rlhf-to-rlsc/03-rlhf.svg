<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-labelledby="title desc">
<title id="title">RLHF: learn the judge, then improve the policy</title><desc id="desc">Human comparisons train a reward model. That model scores new responses sampled from the LLM and those rewards guide a policy update.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="434" rx="20" fill="#f8faf2"/>
<text x="28" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5d702d">03 / REINFORCEMENT LEARNING</text>
<text x="28" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242c12">RLHF: learn the judge, then improve the policy</text>
<path d="M28 81 Q240 79 430 82" fill="none" stroke="#bdce8a" stroke-width="2"/>
<path d="M40 113 Q168.0 111.5 296 113 Q308 113 308 125 L308 187 Q309 199 296 199 Q168.0 200.5 40 199 Q27 199 28 187 L28 125 Q28 113 40 113 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
