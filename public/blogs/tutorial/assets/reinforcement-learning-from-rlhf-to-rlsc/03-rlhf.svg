<path d="M452 324 L308 324" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">The learned score is a proxy for human preference, with its own blind spots.</text>
