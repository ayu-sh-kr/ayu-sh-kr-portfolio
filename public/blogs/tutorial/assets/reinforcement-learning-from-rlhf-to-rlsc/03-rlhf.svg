<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">RLHF pipeline</title><desc id="desc">Candidate model responses are ranked by people, those preferences train a reward model, and the reward model guides policy optimization.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d702d"/></marker></defs><rect x="8" y="8" width="984" height="404" rx="28" fill="#f8faf2" stroke="#d9e2bd" stroke-width="3"/><path d="M35 55 C130 30 205 65 300 40" fill="none" stroke="#d9e2bd" stroke-width="3" stroke-dasharray="9 10"/><path d="M245 200 L280 200" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M475 200 L510 200" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M715 200 L750 200" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><g transform="translate(55 150)"><rect x="2" y="3" width="190" height="100" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="190" height="100" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="7 4"/><text x="95" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Responses</text><text x="95" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">A · B · C</text></g><g transform="translate(285 150)"><rect x="2" y="3" width="190" height="100" rx="18" fill="#ecf0df" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="190" height="100" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="0"/><text x="95" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Humans</text><text x="95" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">B > A > C</text></g><g transform="translate(515 150)"><rect x="2" y="3" width="200" height="100" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="200" height="100" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="7 4"/><text x="100" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Reward model</text><text x="100" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">learn preference</text></g><g transform="translate(755 150)"><rect x="2" y="3" width="190" height="100" rx="18" fill="#ecf0df" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="190" height="100" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="0"/><text x="95" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Policy</text><text x="95" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">optimize</text></g></svg>