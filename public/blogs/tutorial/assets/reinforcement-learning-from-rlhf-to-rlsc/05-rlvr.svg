2" stroke-dasharray="7 4"/><text x="90" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Answer</text><text x="90" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">model output</text></g><g transform="translate(300 55)"><rect x="2" y="3" width="170" height="85" rx="18" fill="#ecf0df" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="170" height="85" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="0"/><text x="85" y="34.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Calculator</text><text x="85" y="62.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">math</text></g><g transform="translate(300 165)"><rect x="2" y="3" width="170" height="85" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="170" height="85" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="7 4"/><text x="85" y="34.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Tests</text><text x="85" y="62.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">code</text></g><g transform="translate(300 275)"><rect x="2" y="3" width="170" height="85" rx="18" fill="#ecf0df" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="170" height="85" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="0"/><text x="85" y="34.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">SQL / proof</text><text x="85" y="62.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">execute</text></g><g transform="translate(600 150)"><rect x="2" y="3" width="160" height="100" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" 