<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">The same loop, now generating language</title><desc id="desc">The prompt and generated tokens define the state. A language model samples token actions. An evaluator scores the response and a training update changes future token choices.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="330" rx="20" fill="#f8faf2"/>
<text x="28" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5d702d">02 / REINFORCEMENT LEARNING</text>
<text x="28" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242c12">The same loop, now generating language</text>
<path d="M28 81 Q240 79 430 82" fill="none" stroke="#bdce8a" stroke-width="2"/>
<path d="M40 120 Q126.0 118.5 212 120 Q224 120 224 132 L224 194 Q225 206 212 206 Q126.0 207.5 40 206 Q27 206 28 194 L28 132 Q28 120 40 120 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="44" y="143" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">STATE</text>
<text x="44" y="165" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Context</text>
<text x="44" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Prompt + tokens so far</text>
<path d="M294 120 Q380.0 118.5 466 120 Q478 120 478 132 L478 194 Q479 206 466 206 Q380.0 207.5 294 206 Q281 206 282 194 L282 132 Q282 120 294 120 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="298" y="143" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">ACTIONS</text>
<text x="298" y="165" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">LLM policy</text>
<text x="298" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Sample the next tokens</text>
<path d="M548 120 Q634.0 118.5 720 120 Q732 120 732 132 L732 194 Q733 206 720 206 Q634.0 207.5 548 206 Q535 206 536 194 L536 132 Q536 120 548 120 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="552" y="143" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">REWARD</text>
<text x="552" y="165" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Evaluator</text>
<text x="552" y="187" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Score the response</text>
<path d="M224 163 L282 163" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M478 163 L536 163" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M634 206 L634 258 L380 258 L380 206" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="267" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#5d702d">Training changes future choices</text>
<text x="28" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Ordinary generation or retrying a tool call does not itself update model weights.</text>
