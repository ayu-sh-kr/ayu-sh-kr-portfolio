<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">RLSC: an internal probability signal</title><desc id="desc">A frozen sampling policy produces candidate responses and their probabilities. These probabilities weight the loss used to update the trainable model. The loop has no independent correctness verifier.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="420" rx="20" fill="#f8faf2"/>
<text x="28" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5d702d">06 / REINFORCEMENT LEARNING</text>
<text x="28" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242c12">RLSC: an internal probability signal</text>
<path d="M28 81 Q240 79 430 82" fill="none" stroke="#bdce8a" stroke-width="2"/>
<path d="M40 111 Q168.0 109.5 296 111 Q308 111 308 123 L308 185 Q309 197 296 197 Q168.0 198.5 40 197 Q27 197 28 185 L28 123 Q28 111 40 111 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="44" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">1 / SAMPLE</text>
<text x="44" y="156" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Frozen sampling policy</text>
<text x="44" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Generate candidate responses</text>
<path d="M464 111 Q592.0 109.5 720 111 Q732 111 732 123 L732 185 Q733 197 720 197 Q592.0 198.5 464 197 Q451 197 452 185 L452 123 Q452 111 464 111 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="468" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">2 / WEIGHT</text>
<text x="468" y="156" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Response probabilities</text>
<text x="468" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Signal from the sampling policy</text>
<path d="M308 154 L452 154" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M464 273 Q592.0 271.5 720 273 Q732 273 732 285 L732 347 Q733 359 720 359 Q592.0 360.5 464 359 Q451 359 452 347 L452 285 Q452 273 464 273 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="468" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">3 / TRAIN</text>
<text x="468" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Weighted training loss</text>
<text x="468" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Favour higher-probability samples</text>
<path d="M40 273 Q168.0 271.5 296 273 Q308 273 308 285 L308 347 Q309 359 296 359 Q168.0 360.5 40 359 Q27 359 28 347 L28 285 Q28 273 40 273 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="44" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">4 / RESULT</text>
<text x="44" y="318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Updated model</text>
<text x="44" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">A more concentrated distribution</text>
<path d="M592 197 L592 273" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M452 316 L308 316" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="397" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Model probability is not a calibrated probability that an answer is correct.</text>
</svg>
