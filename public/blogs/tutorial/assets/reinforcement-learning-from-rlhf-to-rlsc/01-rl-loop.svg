<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">The reinforcement learning loop</title><desc id="desc">An agent observes state, takes an action, receives reward from the environment, and updates its policy.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d702d"/></marker></defs><rect x="8" y="8" width="984" height="404" rx="28" fill="#f8faf2" stroke="#d9e2bd" stroke-width="3"/><path d="M35 55 C130 30 205 65 300 40" fill="none" stroke="#d9e2bd" stroke-width="3" stroke-dasharray="9 10"/><path d="M260 195 L305 195" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M500 195 L545 195" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M740 195 L785 195" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M865 250 C865 335 165 335 165 250" fill="none" stroke="#5d702d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><g transform="translate(70 145)"><rect x="2" y="3" width="190" height="100" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="190" height="100" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="7 4"/><text x="95" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">State</text><text x="95" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">what I see</text></g><g transform="translate(310 145)"><rect x="2" y="3" width="190" height="100" rx="18" fill="#ecf0df" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="190" height="100" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="0"/><text x="95" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Action</text><text x="95" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">what I try</text></g><g transform="translate(550 145)"><rect x="2" y="3" width="190" height="100" rx="18" fill="#f8faf2" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="190" height="100" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="7 4"/><text x="95" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Environment</text><text x="95" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">what happens</text></g><g transform="translate(790 145)"><rect x="2" y="3" width="150" height="100" rx="18" fill="#ecf0df" stroke="#5d702d" stroke-width="3"/><rect x="0" y="0" width="150" height="100" rx="18" fill="none" stroke="#242c12" stroke-width="2" stroke-dasharray="0"/><text x="75" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#242c12">Reward</text><text x="75" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5d702d">how it went</text></g></svg>