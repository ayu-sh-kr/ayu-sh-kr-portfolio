<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">Actions create experience. Experience changes the policy.</title><desc id="desc">A policy chooses actions in the environment. The environment returns a new state and reward. Experience feeds a learning update that changes the policy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="410" rx="20" fill="#f8faf2"/>
<text x="28" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5d702d">01 / REINFORCEMENT LEARNING</text>
<text x="28" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242c12">Actions create experience. Experience changes the policy.</text>
<path d="M28 81 Q240 79 430 82" fill="none" stroke="#bdce8a" stroke-width="2"/>
<path d="M40 123 Q163.0 121.5 286 123 Q298 123 298 135 L298 197 Q299 209 286 209 Q163.0 210.5 40 209 Q27 209 28 197 L28 135 Q28 123 40 123 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="44" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">DECIDE</text>
<text x="44" y="168" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Agent / policy</text>
<text x="44" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Choose an action from the state</text>
<path d="M474 123 Q597.0 121.5 720 123 Q732 123 732 135 L732 197 Q733 209 720 209 Q597.0 210.5 474 209 Q461 209 462 197 L462 135 Q462 123 474 123 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="478" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">INTERACT</text>
<text x="478" y="168" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Environment</text>
<text x="478" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Return next state and reward</text>
<path d="M298 148 L462 148" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="325" y="137" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">action</text>
<path d="M462 188 L298 188" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="322" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">state + reward</text>
<path d="M257 274 Q380.0 272.5 503 274 Q515 274 515 286 L515 348 Q516 360 503 360 Q380.0 361.5 257 360 Q244 360 245 348 L245 286 Q245 274 257 274 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="261" y="297" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">TRAIN</text>
<text x="261" y="319" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Learning update</text>
<text x="261" y="341" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Use collected experience</text>
<path d="M597 209 L597 242 L380 242 L380 274" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M245 317 L163 317 L163 209" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">The policy improves expected return across attempts, not just the next reward.</text>
</svg>
