<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" viewBox="0 0 760 464" role="img" aria-labelledby="title desc">
<title id="title">A coding-task design: checks before preferences</title><desc id="desc">An illustrative reward design: a candidate patch faces required correctness and scope checks. Failures receive failure feedback; passing patches can be compared for explanation quality.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5d702d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="464" rx="20" fill="#f8faf2"/>
<text x="28" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5d702d">07 / REINFORCEMENT LEARNING</text>
<text x="28" y="65" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#242c12">A coding-task design: checks before preferences</text>
<path d="M28 81 Q240 79 430 82" fill="none" stroke="#bdce8a" stroke-width="2"/>
<path d="M40 114 Q168.0 112.5 296 114 Q308 114 308 126 L308 188 Q309 200 296 200 Q168.0 201.5 40 200 Q27 200 28 188 L28 126 Q28 114 40 114 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="44" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">ATTEMPT</text>
<text x="44" y="159" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Candidate patch</text>
<text x="44" y="181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Code + explanation</text>
<path d="M464 114 Q592.0 112.5 720 114 Q732 114 732 126 L732 188 Q733 200 720 200 Q592.0 201.5 464 200 Q451 200 452 188 L452 126 Q452 114 464 114 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="468" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">GATE</text>
<text x="468" y="159" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Required checks</text>
<text x="468" y="181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Correctness + allowed scope</text>
<path d="M308 157 L452 157" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M40 299 Q168.0 297.5 296 299 Q308 299 308 311 L308 373 Q309 385 296 385 Q168.0 386.5 40 385 Q27 385 28 373 L28 311 Q28 299 40 299 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="44" y="322" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">FAIL</text>
<text x="44" y="344" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Failure feedback</text>
<text x="44" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">A good explanation cannot rescue it</text>
<path d="M464 299 Q592.0 297.5 720 299 Q732 299 732 311 L732 373 Q733 385 720 385 Q592.0 386.5 464 385 Q451 385 452 373 L452 311 Q452 299 464 299 Z" fill="#ecf0df" stroke="#5d702d" stroke-width="1.7" stroke-linejoin="round"/>
<text x="468" y="322" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5d702d">PASS</text>
<text x="468" y="344" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#242c12">Preference feedback</text>
<text x="468" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Compare useful explanations</text>
<path d="M522 200 L522 245 L168 245 L168 299" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="274" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">one required check fails</text>
<path d="M652 200 L652 299" fill="none" stroke="#5d702d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="668" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">pass</text>
<text x="28" y="441" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#5d702d">Illustrative design. Evaluate resulting behaviour on independent, unseen tasks.</text>
