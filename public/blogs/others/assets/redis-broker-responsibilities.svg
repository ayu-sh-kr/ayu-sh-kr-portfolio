<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" role="img" aria-labelledby="title desc"><title id="title">Broker responsibilities</title><desc id="desc">Four cards compare the primary responsibility of Kafka, RabbitMQ, MQTT, and Redis.</desc><defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#242c12" flood-opacity=".1"/></filter></defs><rect width="920" height="230" rx="22" fill="#f8faf2"/><text x="40" y="42" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700" fill="#242c12">Choose by responsibility</text><g font-family="Inter,system-ui,sans-serif" filter="url(#shadow)"><g><rect x="40" y="70" width="200" height="120" rx="14" fill="#d9e2bd" stroke="#92a951" stroke-width="2"/><text x="60" y="98" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5d702d">RETAIN</text><text x="60" y="129" font-size="18" font-weight="700" fill="#242c12">Kafka</text><text x="60" y="156" font-size="14" fill="#4c5c25">Event history</text><text x="60" y="176" font-size="14" fill="#4c5c25">and replay</text></g><g><rect x="260" y="70" width="200" height="120" rx="14" fill="#fff" stroke="#d9e2bd" stroke-width="2"/><text x="280" y="98" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5d702d">ROUTE</text><text x="280" y="129" font-size="18" font-weight="700" fill="#242c12">RabbitMQ</text><text x="280" y="156" font-size="14" fill="#4c5c25">Work queues</text><text x="280" y="176" font-size="14" fill="#4c5c25">and acknowledgements</text></g><g><rect x="480" y="70" width="200" height="120" rx="14" fill="#fff" stroke="#d9e2bd" stroke-width="2"/><text x="500" y="98" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5d702d">CONNECT</text><text x="500" y="129" font-size="18" font-weight="700" fill="#242c12">MQTT</text><text x="500" y="156" font-size="14" fill="#4c5c25">Device sessions</text><text x="500" y="176" font-size="14" fill="#4c5c25">and QoS delivery</text></g><g><rect x="700" y="70" width="180" height="120" rx="14" fill="#ecf0df" stroke="#92a951" stroke-width="2"/><text x="720" y="98" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5d702d">COORDINATE</text><text x="720" y="129" font-size="18" font-weight="700" fill="#242c12">Redis</text><text x="720" y="156" font-size="14" fill="#4c5c25">Shared state</text><text x="720" y="176" font-size="14" fill="#4c5c25">and live signals</text></g></g></svg>
