<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Pub/Sub versus Streams</title>
  <desc id="desc">Pub/Sub sends live broadcasts that disappear, while Streams retains entries for consumer acknowledgement and recovery.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#5d702d"/></marker><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#242c12" flood-opacity=".1"/></filter></defs>
  <rect width="900" height="280" rx="22" fill="#f8faf2"/><text x="40" y="42" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700" fill="#242c12">Live broadcast or recoverable queue?</text>
  <g id="cards" font-family="Inter,system-ui,sans-serif" filter="url(#shadow)">
    <rect x="40" y="80" width="210" height="70" rx="14" fill="#ecf0df" stroke="#92a951" stroke-width="2"/><text x="60" y="108" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">PUB/SUB</text><text x="60" y="134" font-size="17" font-weight="700" fill="#242c12">Publisher</text>
    <rect x="350" y="80" width="200" height="70" rx="14" fill="#fff" stroke="#d9e2bd" stroke-width="2"/><text x="450" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#242c12">Live subscribers</text>
    <rect x="650" y="80" width="210" height="70" rx="14" fill="#d9e2bd" stroke="#92a951" stroke-width="2"/><text x="755" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#242c12">Message disappears</text>
    <rect x="40" y="170" width="210" height="70" rx="14" fill="#ecf0df" stroke="#92a951" stroke-width="2"/><text x="60" y="198" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d702d">STREAMS</text><text x="60" y="224" font-size="17" font-weight="700" fill="#242c12">Producer</text>
    <rect x="350" y="170" width="200" height="70" rx="14" fill="#fff" stroke="#d9e2bd" stroke-width="2"/><text x="450" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#242c12">Retained entry</text>
    <rect x="650" y="170" width="210" height="70" rx="14" fill="#d9e2bd" stroke="#92a951" stroke-width="2"/><text x="755" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#242c12">Acknowledge</text><text x="755" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#242c12">or recover</text>
  </g>
  <g id="connectors" fill="none" stroke="#5d702d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"><path d="M250 115H350"/><path d="M550 115H650"/><path d="M250 205H350"/><path d="M550 205H650"/></g>
</svg>
